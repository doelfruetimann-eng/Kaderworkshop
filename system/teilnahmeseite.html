:root{
  --bordeaux:#8A0B38;--gelb:#FFD136;--navy:#1A365D;--blau:#0B65A1;
  --ground:#F3F3F3;--surface:#FFFFFF;--surface-2:#EAEAEA;
  --ink:#1C1C1C;--ink-2:#4E4E4E;--ink-3:#7A7A7A;--line:#E0E0E0;--line-2:#D6D6D6;
  --accent:var(--bordeaux);--accent-ink:#fff;--accent-soft:#F6E6EC;
  --signal:var(--gelb);--signal-ink:#6B4E00;--signal-soft:#FFF3D0;
  --struktur:var(--navy);--struktur-ink:#fff;--zahl:var(--blau);
  --good:#1F6B45;--good-soft:#E2F0E8;--crit:#A32218;--crit-soft:#F8E4E2;
  --sans:"PT Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D1726;--surface:#152439;--surface-2:#1E3049;
  --ink:#E9EDF3;--ink-2:#AFBCCC;--ink-3:#8494A8;--line:#26374F;--line-2:#354964;
  --accent:#E86A93;--accent-ink:#2A0512;--accent-soft:#391724;
  --signal-soft:#3A2E0E;--signal-ink:#FFD136;--struktur:#0A1424;--zahl:#63B3E4;
  --good:#63C795;--good-soft:#14301F;--crit:#F0897C;--crit-soft:#3A1A16;}}
:root[data-theme="dark"]{
  --ground:#0D1726;--surface:#152439;--surface-2:#1E3049;
  --ink:#E9EDF3;--ink-2:#AFBCCC;--ink-3:#8494A8;--line:#26374F;--line-2:#354964;
  --accent:#E86A93;--accent-ink:#2A0512;--accent-soft:#391724;
  --signal-soft:#3A2E0E;--signal-ink:#FFD136;--struktur:#0A1424;--zahl:#63B3E4;
  --good:#63C795;--good-soft:#14301F;--crit:#F0897C;--crit-soft:#3A1A16;}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.22;font-weight:700;text-wrap:balance}
p{margin:0}
a{color:var(--zahl)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font-family:var(--sans)}

.top{background:var(--struktur);color:var(--struktur-ink)}
.top-in{max-width:760px;margin:0 auto;padding:8px 20px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.top-in .g{color:#C9D6E6}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 90px}
header.kopf{padding:24px 0 6px}
.logo-zeile{margin-bottom:14px}
.logo{height:44px;width:auto;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-zeile{background:#fff;display:inline-block;padding:8px 12px;border-radius:4px}}
:root[data-theme="dark"] .logo-zeile{background:#fff;display:inline-block;padding:8px 12px;border-radius:4px}
.eyebrow{font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);font-weight:700}

/* Schrittleiste — zeigt immer, wo man im Prozess steht */
.leiste{display:flex;gap:4px;margin:18px 0 8px;padding:0;list-style:none}
.leiste li{flex:1;min-width:0;text-align:center;position:relative}
.leiste .pkt{width:26px;height:26px;margin:0 auto;border-radius:50%;display:grid;place-items:center;
  font-size:12.5px;font-weight:700;background:var(--surface-2);color:var(--ink-3);border:2px solid var(--line-2)}
.leiste li::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line-2);z-index:-1}
.leiste li:first-child::before{display:none}
.leiste .lbl{display:block;font-size:11px;margin-top:5px;color:var(--ink-3);letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leiste li.fertig .pkt{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.leiste li.jetzt .pkt{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.leiste li.jetzt .lbl{color:var(--ink);font-weight:700}
.leiste li.geht{cursor:pointer}
.leiste li.geht:hover .pkt,.leiste li.geht:focus-visible .pkt{border-color:var(--accent);color:var(--accent)}
.leiste li.geht:hover .lbl{color:var(--ink)}
@media(max-width:560px){.leiste .lbl{display:none}.leiste li.jetzt .lbl{display:block;position:absolute;left:50%;transform:translateX(-50%);max-width:120px}
  .leiste{margin-bottom:26px}}

/* Bildschirm-Karte */
.schirm{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px 24px 20px;margin-top:14px}
@media(max-width:560px){.schirm{padding:18px 16px 16px}}
.schirm .snr{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--zahl);font-weight:700}
.schirm h2{font-size:clamp(21px,4vw,28px);margin-top:6px;text-wrap:balance}
.schirm .tl{width:64px;height:4px;background:var(--signal);margin:12px 0 6px}

/* Warum dieser Schritt */
.warum{display:flex;gap:10px;background:var(--signal-soft);border-left:4px solid var(--signal);
  padding:11px 14px;margin:14px 0 4px;font-size:14.5px;color:var(--ink-2);border-radius:0 4px 4px 0}
.warum b{color:var(--ink);display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}

.lob{display:flex;gap:9px;align-items:baseline;background:var(--good-soft);border-left:4px solid var(--good);
  padding:10px 14px;margin:0 0 14px;font-size:14.5px;color:var(--ink-2);border-radius:0 4px 4px 0}
.lob b{color:var(--good)}

.hinweis{background:var(--surface-2);border-radius:4px;padding:11px 14px;margin-top:14px;font-size:14px;color:var(--ink-2)}
.schirm p.text{margin-top:12px;color:var(--ink-2);max-width:62ch}
.schirm p.text b{color:var(--ink)}

/* Formulare */
label.fld{display:block;margin-top:16px}
.lbl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15.5px;margin-bottom:7px}
.lbl .lbl-tools{margin-left:auto;display:inline-flex;gap:6px}
textarea,input[type="text"]{width:100%;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);
  color:var(--ink);font:inherit;font-size:15.5px;padding:10px 12px}
textarea{min-height:110px;resize:vertical;overflow-y:hidden}
textarea:focus,input[type="text"]:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.feldhint{font-size:13.5px;color:var(--ink-3);margin-top:6px}

.wahl{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.wahl label{display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--line-2);
  border-radius:4px;padding:11px 14px;cursor:pointer;font-size:15.5px;transition:border-color .12s}
.wahl label:hover{border-color:var(--accent)}
.wahl input{margin-top:4px;accent-color:var(--accent);flex:none}
.wahl label.an{border-color:var(--accent);background:var(--accent-soft)}
.wahl .klein{font-size:13.5px;color:var(--ink-3);display:block}

/* Nachfrage im geführten Erfassen */
.nachfrage{display:flex;gap:10px;background:var(--accent-soft);border-left:4px solid var(--accent);
  padding:12px 14px;margin-top:12px;font-size:15px;border-radius:0 4px 4px 0}
.nachfrage b{color:var(--accent);flex:none}

/* Themen-Hub */
.thema{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:13px 16px;margin-top:10px;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.thema .tt{font-weight:700;flex:1;min-width:180px}
.thema .tt .tstat{display:block;font-weight:400;font-size:13px;color:var(--ink-3)}
.thema.voll .tt .tstat{color:var(--good)}
.leer-hin{border:1px dashed var(--line-2);border-radius:4px;padding:16px;margin-top:12px;
  text-align:center;color:var(--ink-3);font-size:14.5px}

/* Kontrolle */
.ksum{background:var(--surface);border:1px solid var(--line);border-radius:4px;margin-top:12px;overflow:hidden}
.ksum .kkopf{padding:11px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;gap:10px;align-items:baseline}
.ksum .kkopf .snr2{color:var(--zahl);font-size:13px}
.ksum .kbody{padding:12px 16px;font-size:14.5px;color:var(--ink-2)}
.ksum .kbody dt{font-weight:700;color:var(--ink);margin-top:9px;font-size:13.5px}
.ksum .kbody dt:first-child{margin-top:0}
.ksum .kbody dd{margin:1px 0 0}
.ksum .kbody dl{margin:0}
.fehlt{color:var(--crit);font-style:italic}
.btn-link{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.btn-link:hover{filter:brightness(1.2)}

/* Erklaerung «Worum es geht»: Merkmale als Kartenreihe, Suchfragen, Wege */
.merkmale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 4px}
.merkmal{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--zahl);
  border-radius:4px;padding:11px 13px}
.merkmal b{display:block;font-size:14.5px;margin-bottom:3px}
.merkmal span{font-size:13.5px;color:var(--ink-2);line-height:1.45}
.suchfragen{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:7px}
.suchfragen li{position:relative;padding-left:26px;font-size:14.5px;color:var(--ink-2);line-height:1.5}
.suchfragen li::before{content:"?";position:absolute;left:0;top:0;width:18px;height:18px;border-radius:50%;
  background:var(--signal-soft);color:var(--signal-ink);font-weight:700;font-size:12px;
  display:flex;align-items:center;justify-content:center}
.wege{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0 4px}
.weg{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:13px 15px}
.weg.empfohlen{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.weg .wkopf{display:flex;gap:8px;align-items:baseline;font-weight:700;font-size:15px;margin-bottom:5px}
.weg .wtag{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  background:var(--accent-soft);color:var(--accent);padding:2px 7px;border-radius:999px}
.weg p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.5}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);
  color:var(--ink);font-weight:700;font-size:14.5px;padding:10px 18px;border-radius:4px;cursor:pointer;
  transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-3)}
.btn-ghost:hover{color:var(--accent);border-color:transparent}
.btn-gross{font-size:16px;padding:13px 26px;text-transform:uppercase;letter-spacing:.05em}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.iconbtn{width:34px;height:34px;border:1px solid var(--line-2);border-radius:50%;background:var(--surface);
  display:inline-grid;place-items:center;cursor:pointer;padding:0}
.iconbtn svg{width:18px;height:18px;fill:var(--ink-2)}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn:hover svg{fill:var(--accent)}
.iconbtn.an{background:var(--accent);border-color:var(--accent);animation:puls 1.4s infinite}
.iconbtn.an svg{fill:var(--accent-ink)}
@keyframes puls{0%,100%{box-shadow:0 0 0 0 rgba(138,11,56,.35)}50%{box-shadow:0 0 0 7px rgba(138,11,56,0)}}

.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.nav .rechts{margin-left:auto;display:flex;gap:10px;align-items:center}

/* Fortschritt im Erfassen */
.efort{height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:14px}
.efort i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* Banner */
.banner{display:flex;gap:10px;background:var(--good-soft);border-left:4px solid var(--good);
  padding:11px 14px;margin-top:14px;font-size:14.5px;border-radius:0 4px 4px 0}

/* KI-Gespräch */
.chat{border:1px solid var(--line);border-radius:6px;margin-top:14px;background:var(--surface);overflow:hidden}
.chat-verlauf{max-height:420px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.blase{max-width:85%;padding:10px 14px;border-radius:12px;font-size:15px;white-space:pre-wrap}
.blase.ich{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:3px}
.blase.ki{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:3px}
.blase.denkt{color:var(--ink-3);font-style:italic}
.chat-ein{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat-ein textarea{min-height:44px;max-height:45vh;flex:1}

/* Dialog-Overlay (eigener Ersatz für confirm) */
.ov{position:fixed;inset:0;background:rgba(10,16,28,.55);display:grid;place-items:center;padding:18px;z-index:60}
.ov-card{background:var(--surface);border-radius:8px;max-width:480px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.ov-top{padding:15px 20px;border-bottom:1px solid var(--line)}
.ov-titel{font-weight:700;font-size:16.5px}
.dlg-body{padding:15px 20px;font-size:14.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:9px}
.ov-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.row{display:inline-flex;align-items:center}.gap-8{gap:8px}
.btn-danger{background:var(--crit);border-color:var(--crit);color:#fff}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--struktur);color:var(--struktur-ink);padding:11px 20px;border-radius:99px;font-size:14.5px;
  pointer-events:none;transition:opacity .25s,transform .25s;z-index:70;max-width:calc(100vw - 40px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.fuss{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-3)}
details.ds{margin-top:14px;font-size:14px;color:var(--ink-2)}
details.ds summary{cursor:pointer;font-weight:700;color:var(--ink)}
details.ds p{margin-top:8px}
video.lern{width:100%;border-radius:6px;margin-top:12px;border:1px solid var(--line)}

/* Zusammenfassung zum Mitnehmen: am Schirm unsichtbar, im Druck das Einzige */
.zusdruck{display:none}
@media print{
  body *{visibility:hidden}
  #zusdruck, #zusdruck *{visibility:visible}
  #zusdruck{display:block;position:absolute;left:0;top:0;width:100%;
    white-space:pre-wrap;font:12pt/1.5 Georgia,"Times New Roman",serif;color:#000;margin:0;padding:0}
}

<script>
"use strict";
document.documentElement.lang = "de-CH";   /* Rechtschreibprüfung und Vorlesestimme auf Deutsch */
/* Autokorrektur und Diktierhilfen der Geräte ausdrücklich zulassen */
const TIPP = ' spellcheck="true" autocapitalize="sentences" autocorrect="on"';

/* Antwortfelder wachsen mit dem Inhalt — beim Diktieren entstehen lange Absaetze,
   die sonst in einem 110px hohen Guckloch scrollen wuerden. */
function wachsen(el){
  if(!el || el.tagName !== "TEXTAREA") return;
  el.style.overflowY = "hidden";
  el.style.height = "auto";
  const gewuenscht = el.scrollHeight;
  el.style.height = gewuenscht + "px";
  /* CSS kann per max-height deckeln — erst danach steht fest, ob gescrollt werden muss. */
  if(el.clientHeight < gewuenscht - 1) el.style.overflowY = "auto";
}
function alleWachsen(){
  document.querySelectorAll("textarea").forEach(wachsen);
}
document.addEventListener("input", function(e){ wachsen(e.target); });
window.addEventListener("resize", alleWachsen);
/* ============================================================
   Teilnahme-Seite Kadertagung Finanzbereich.
   Eine Datei, geführter Ablauf. Die Beiträge gehen beim
   Absenden an die eigene API (/api/kadertagung/…).
   ?demo=1 läuft ohne Server, für Sichtprüfung und Video.
   ============================================================ */
const API = "/api/kadertagung/";
const DEMO = /[?&]demo=1/.test(location.search);
const TOKEN = (/[?&]t=([A-Za-z0-9]+)/.exec(location.search) || [])[1] || "";
const KEY = "kadertagung-teilnahme-v1:" + (DEMO ? "demo" : TOKEN);
const HILFE_MAIL = "Doelf.Ruetimann@spitaeler-sh.ch";

/* Die 4-stellige PIN aus der Einladungsmail: einmal bestätigt, bleibt sie auf
   dem Gerät gemerkt und geht bei jedem Serveraufruf mit. */
const PINKEY = "kadertagung-pin-v1:" + TOKEN;
let PIN = "";
try{ PIN = localStorage.getItem(PINKEY) || ""; }catch(e){}

/* ---------- Menuewahl fuer das Abendessen (Kontrolle waehlt, Fertig zeigt) ---------- */
const MENUES = [
  ["cordonbleu",     "Cordon bleu — stellst du dir am Abend von der Karte zusammen"],
  ["wienerschnitzel","Wienerschnitzel (Kalb) mit Preiselbeeren"],

  ["keins",          "Ich esse nicht mit"],
];
function menueText(wert){
  const treffer = MENUES.find(m => m[0] === wert);
  return treffer ? treffer[1] : "";
}

/* ---------- Leitfragen und Prüfregeln (aus der Werkbank übernommen) ---------- */
const LEITFRAGEN = [
  {k:"f1", t:"Worum geht es konkret?",            h:"Kurze Beschreibung des Prozesses, der Aufgabe oder der wiederkehrenden Situation.",
   b:"Für den Monatsbericht kopieren wir Zahlen aus drei Systemen in eine Excel-Mappe und kommentieren jeden Bereich von Hand."},
  {k:"f2", t:"Was läuft heute nicht optimal?",    h:"Was ist mühsam, aufwendig, langsam, fehleranfällig oder unklar? Warum kostet es Zeit, Energie oder Qualität?",

  {k:"f3", t:"Wer ist betroffen oder beteiligt?", h:"Personen, Teams, Schnittstellen oder externe Stellen.",

  {k:"f5", t:"Was wäre ein gutes Zielbild?",      h:"Wie müsste der Prozess idealerweise funktionieren?",

  {k:"f6", t:"Wo könnte KI oder Digitalisierung unterstützen?", h:"Eine erste Vermutung genügt — es braucht noch keine fertige Lösung.",
   b:"Ein Sprachmodell erstellt den Kommentarentwurf aus den Zahlen."}
];
const RX = {
  menge:  /\d|stund|tag|woche|monat|quartal|jahr|prozent|%|mal\b|häufig|täglich|wöchentlich|monatlich/i,
  rollen: /team|abteilung|einheit|dienst|leitung|controlling|rechnungswesen|buchhaltung|einkauf|logistik|informatik|ict|hr|pflege|ärzt|arzt|codierung|medizintechnik|extern|lieferant|kasse|patient|mitarbeit|gremium|sekretariat/i,

};
const PRUEFUNG = {
  titel: [{ok:t=>t.trim().length>=5, frage:"Wie würdest du den Pain Point in wenigen Worten benennen?"}],
  f1: [{ok:t=>t.trim().split(/\s+/).length>=10, frage:"Beschreib den Ablauf bitte etwas genauer: Was passiert von Anfang bis Ende?"}],
  f2: [{ok:t=>RX.menge.test(t), frage:"Wie viel Zeit kostet das ungefähr — pro Woche oder pro Monat?"}],
  f3: [{ok:t=>RX.rollen.test(t), frage:"Welche Teams, Schnittstellen oder externen Stellen sind ausserdem beteiligt?"}],
  f4: [{ok:t=>RX.daten.test(t), frage:"Welche Systeme, Dateien oder Dokumente sind konkret im Spiel?"}],
  f5: [{ok:t=>t.trim().split(/\s+/).length>=8, frage:"Wie müsste es im Idealfall laufen — woran würdest du merken, dass es besser ist?"}],
  f6: [{ok:t=>t.trim().length>=15, frage:"Wo könnte KI oder Digitalisierung ansetzen? Eine Vermutung genügt."}]
};
function pruefe(feld, wert){
  const t = String(wert || "");
  if(!t.trim()) return null;                       /* leer = überspringen, keine Nachfrage */
  const regel = (PRUEFUNG[feld] || []).find(r => !r.ok(t));
  return regel ? regel.frage : null;
}

function frage(o){
  return new Promise(fertigMit => {
    const ov = document.createElement("div");
    ov.className = "ov";
    ov.setAttribute("role","dialog");
    ov.setAttribute("aria-modal","true");
    const zeilen = Array.isArray(o.text) ? o.text : [o.text];
    ov.innerHTML =
      '<div class="ov-card">' +
        '<div class="ov-top"><span class="ov-titel">' + esc(o.titel || "Bitte bestätigen") + '</span></div>' +
        '<div class="dlg-body">' + zeilen.map(z => "<p>" + esc(z) + "</p>").join("") + '</div>' +
        '<div class="ov-foot">' +
          (o.nein !== "" ? '<button class="btn btn-ghost" data-w="nein">' + esc(o.nein || "Abbrechen") + '</button>' : '<span></span>') +
          '<span class="row gap-8">' +
            (o.drittens ? '<button class="btn" data-w="drei">' + esc(o.drittens) + '</button>' : '') +
            '<button class="btn ' + (o.gefahr ? "btn-danger" : "btn-primary") + '" data-w="ja">' + esc(o.ja || "OK") + '</button>' +
          '</span>' +
        '</div>' +
      '</div>';
    document.body.appendChild(ov);
    const schliessen = wahl => { document.removeEventListener("keydown", taste); ov.remove(); fertigMit(wahl); };
    const taste = e => {
      if(e.key === "Escape"){ e.preventDefault(); schliessen("nein"); }
    };
    ov.addEventListener("click", e => {
      const b = e.target.closest("[data-w]");
      if(b){ schliessen(b.dataset.w); return; }
      if(e.target === ov) schliessen("nein");
    });
    document.addEventListener("keydown", taste);
    const j = ov.querySelector('[data-w="ja"]'); if(j) j.focus();
  });
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const EINGEBETTET = (function(){ try{ return window.self !== window.top; }catch(e){ return true; } })();
const KANN_DIKTAT = !!SR && !EINGEBETTET;
const KANN_VORLESEN = typeof window.speechSynthesis !== "undefined";
const SPRACHE = "de-CH";
let micGesperrt = false;

function stimmen(){
  if(!KANN_VORLESEN) return [];
  const alle = window.speechSynthesis.getVoices() || [];
  const de = alle.filter(v => /^de/i.test(v.lang));
  const punkte = v => (/google/i.test(v.name) ? 0 : /microsoft|natural|neural/i.test(v.name) ? 1 : 2);
  return (de.length ? de : alle).slice().sort((a,b) => punkte(a) - punkte(b));
}
function gewaehlteStimme(){
  const liste = stimmen();
  if(!liste.length) return null;
  return liste.find(v => /google/i.test(v.name) && /^de/i.test(v.lang))
      || liste.find(v => /^de/i.test(v.lang))
      || liste[0];
}
if(KANN_VORLESEN){ window.speechSynthesis.getVoices(); }
function vorlesen(text){
  if(!KANN_VORLESEN || !text) return;
  try{ window.speechSynthesis.cancel(); }catch(e){}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = SPRACHE; u.rate = 1;
  const v = gewaehlteStimme();
  if(v){ try{ u.voice = v; u.lang = v.lang; }catch(e){} }
  window.speechSynthesis.speak(u);
}
function stillsein(){ if(KANN_VORLESEN){ try{ window.speechSynthesis.cancel(); }catch(e){} } }

function micFreigabe(){ try{ return localStorage.getItem(MIC_KEY) === "ok"; }catch(e){ return false; } }
function mitMic(fn){
  if(EINGEBETTET && SR){
    toast("In dieser eingebetteten Vorschau gibt der Browser das Mikrofon nicht frei — auf der echten Seite funktioniert das Diktat.");
    return;
  }
  if(!KANN_DIKTAT){ toast("Dieser Browser kennt keine Spracheingabe — Diktat gibt es in Chrome, Edge und Safari."); return; }
  if(micFreigabe()){ fn(); return; }
  frage({titel:"Spracheingabe aktivieren", ja:"Aktivieren", nein:"Nicht jetzt",
    text:["Die Erkennung läuft über den Sprachdienst des Browsers. Chrome und Edge übermitteln die Aufnahme dazu an den Hersteller.",
          "Bitte keine Patientendaten und keine Personendaten diktieren — beschreib Rollen statt Namen.",
          "Die Freigabe gilt für diesen Browser und lässt sich jederzeit widerrufen."]})
    .then(a => {
      if(a !== "ja") return;
      try{ localStorage.setItem(MIC_KEY, "ok"); }catch(e){}
      fn();
    });
}
function sprachbefehle(t){
  return t
    .replace(/\bneuer? absatz\b/gi, "\n\n").replace(/\bneue zeile\b/gi, "\n")
    .replace(/\bdoppelpunkt\b/gi, ":").replace(/\bfragezeichen\b/gi, "?")
    .replace(/\bausrufezeichen\b/gi, "!").replace(/\bkomma\b/gi, ",").replace(/\bpunkt\b/gi, ".")
    .replace(/\s+([,.;:?!])/g, "$1").replace(/[ \t]{2,}/g, " ").trim();
}
function anfuegen(alt, neu){
  if(!neu) return alt;
  if(!String(alt).trim()) return neu.charAt(0).toUpperCase() + neu.slice(1);
  if(/\n$/.test(alt)) return alt + neu;
  return alt.replace(/[ \t]+$/, "") + " " + neu;
}
const Diktat = {
  r:null, btn:null, feld:null, basis:"", timer:null,
  laeuft(){ return !!this.r; },
  start(feld, btn){
    if(!KANN_DIKTAT || !micFreigabe()) return false;
    this.stop();
    const r = new SR();
    r.lang = SPRACHE; r.continuous = true; r.interimResults = true;
    this.r = r; this.feld = feld; this.btn = btn;
    this.basis = feld ? feld.value : "";
    if(btn) btn.classList.add("an");
    r.onresult = e => {
      let fertig = "", zwischen = "";
      for(let i = e.resultIndex; i < e.results.length; i++){
        const t = e.results[i][0].transcript;
        if(e.results[i].isFinal) fertig += t + " "; else zwischen += t;
      }
      if(fertig) this.basis = anfuegen(this.basis, sprachbefehle(fertig));
      if(this.feld){
        this.feld.value = zwischen.trim() ? anfuegen(this.basis, zwischen.trim()) : this.basis;
        if(fertig) this.feld.dispatchEvent(new Event("input", {bubbles:true}));
      }
    };
    r.onerror = ev => {
      if(ev.error === "not-allowed" || ev.error === "service-not-allowed"){
        micGesperrt = true;
        this.stop();
        frage({titel:"Mikrofon gesperrt", ja:"Verstanden", nein:"",
          text:["Der Browser hat den Zugriff auf das Mikrofon verweigert.",
                "Erlaube ihn im Schloss-Symbol links in der Adresszeile und versuch es nochmals.",
                "Tippen funktioniert ganz normal weiter."]});
        return;
      }
      toast(ev.error === "no-speech" ? "Nichts gehört — bitte nochmals."
          : ev.error === "audio-capture" ? "Kein Mikrofon gefunden."
          : "Spracherkennung nicht verfügbar (" + ev.error + ").");
      this.stop();
    };
    r.onend = () => { if(this.r === r) this.stop(); };
    try{ r.start(); }catch(err){ this.stop(); return false; }
    return true;
  },
  stop(){
    clearTimeout(this.timer);
    if(this.r){ const r = this.r; this.r = null; try{ r.stop(); }catch(e){} }
    if(this.feld){
      this.feld.value = this.basis;
      this.feld.dispatchEvent(new Event("input", {bubbles:true}));
      this.feld = null;
    }
    if(this.btn){ this.btn.classList.remove("an"); this.btn = null; }
  }
};

async function api(pfad, daten){
  if(DEMO){
    await new Promise(r => setTimeout(r, 350));
    if(pfad === "abgabe") return {ok:true, gesendet:new Date().toISOString(), zaehler:{einheiten:7, themen:16, total:9}};
    if(pfad === "feedback") return {ok:true};
    if(pfad === "interview"){
      /* Vorschau-Simulation: geskriptetes Gespräch, damit man den Modus erleben kann */
      if(daten && daten.modus === "auszug"){
        /* Wie die echte KI: nur verwenden, was gesagt wurde — offene Fragen bleiben leer. */
        const ich = (daten.verlauf || []).filter(m => m.rolle === "ich").map(m => String(m.text || "").trim());
        const satz = s => { s = s ? s.charAt(0).toUpperCase() + s.slice(1) : ""; return s && !/[.!?]$/.test(s) ? s + "." : s; };
        return {ok:true, felder:{
          titel: (ich[0] || "Neues Thema").charAt(0).toUpperCase() + (ich[0] || "Neues Thema").slice(1, 80),
          f1: satz(ich[0]) + (ich[1] ? " " + satz(ich[1]) : ""),
          f2: ich[2] ? "Aufwand heute: " + satz(ich[2]) : "",
          f3: satz(ich[3]),
          f4: satz(ich[4]),
          f5: satz(ich[5]),
          f6: satz(ich[6])}};
      }
      if(daten && daten.modus === "schaerfen") return {ok:true, felder: Object.assign({}, daten.felder,
        {f2:(String((daten.felder||{}).f2||"").trim() || "Heute nicht optimal") + " — konkret: rund zwei Tage pro Monat, mit wiederkehrenden Kopierfehlern."}),
        fragen:["Wie viele Personen sind an dem Ablauf beteiligt?"]};
      const n = daten && daten.verlauf ? daten.verlauf.filter(m => m.rolle === "ich").length : 0;
      const fragen = [
        "Grüezi " + vorname() + "! Erzähl mir einfach: Welche Aufgabe oder welcher Ablauf hält dich im Alltag regelmässig auf?",
        "Verstanden — magst du kurz beschreiben, wie das heute konkret abläuft, von Anfang bis Ende?",
        "Danke. Wie viel Zeit kostet dich das — pro Woche oder pro Monat? Eine Schätzung genügt völlig.",
        "Und wer ist sonst noch betroffen oder beteiligt — welche Teams oder Schnittstellen?",
        "Mit welchen Systemen, Listen oder Dokumenten arbeitest du dabei?",
        "Wie sähe für dich ein gutes Zielbild aus — woran würdest du merken, dass es gelöst ist?",
        "Letzte Frage: Wo könnte KI oder Digitalisierung hier vermutlich helfen? Eine Vermutung genügt — «weiss nicht» ist auch okay.",
        "Danke, jetzt habe ich alles beisammen. Drück auf «Zusammenfassen und übernehmen» — dann mache ich daraus die sieben Antworten."];
      return {ok:true, antwort: fragen[Math.min(n, fragen.length-1)]};
    }
    return {ok:false};
  }
  const antwort = daten
    ? await fetch(API + pfad, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(PIN ? Object.assign({pin:PIN}, daten) : daten)})
    : await fetch(API + pfad + "?t=" + encodeURIComponent(TOKEN));
  if(!antwort.ok) throw new Error("HTTP " + antwort.status);
  return antwort.json();
}

/* ---------- Im Gespräch erfassen: die KI interviewt, fasst zusammen, übernimmt ---------- */
function vInterview(){
  const eigene = Z.iv.verlauf.filter(m => m.r === "ich").length;
  /* Der Knopf «Zusammenfassen und übernehmen» erscheint erst, wenn die KI
     alle fünf Punkte abgedeckt hat und selbst dazu auffordert — vorher gab
     es Skelette mit nur der ersten Antwort. Rückfalltür: nach acht eigenen
     Antworten auf jeden Fall, falls die KI die Aufforderung nie schreibt. */
  const letzteKi = [...Z.iv.verlauf].reverse().find(m => m.r === "ki");
  const fertigErlaubt = eigene >= 8 ||
    (!!letzteKi && /Zusammenfassen und (ü|ue)bernehmen/i.test(letzteKi.t));
  const verlauf = Z.iv.verlauf.map(m => '<div class="blase ' + (m.r === "ich" ? "ich" : "ki") + '">' + esc(m.t) + '</div>').join("") +
    (Z.iv.denkt ? '<div class="blase ki denkt">… denkt nach</div>' : "");
  return schirm(
    '<span class="snr">Im Gespräch erfassen · ' + (Z.painpoints.length + 1) + '. Thema</span>' +
    '<h2>Erzähl einfach — die KI fragt nach</h2>' +
    '<div class="tl"></div>' +
    '<p class="text">Beschreib in deinen Worten, was dich im Alltag aufhält — tippen oder diktieren. Die KI stellt Rückfragen und macht am Schluss die sieben Antworten daraus. Anpassen kannst du danach alles.</p>' +
    '<p class="feldhint" style="margin-top:-4px">✏️ <b>Sprich oder schreib ruhig drauflos.</b> Tippfehler und Versprecher sind egal — vor dem Absenden glättet die KI die Texte, ohne Zahlen oder Systemnamen zu verändern.</p>' +
    (DEMO ? '<div class="banner"><span><b>Vorschau-Simulation:</b> Hier antwortet ein festes Frage-Skript. Auf der echten Seite führt die KI (Claude) ein individuelles Gespräch — sie geht auf deine Antworten ein und fragt dort nach, wo etwas fehlt.</span></div>' : "") +
    '<div class="chat"><div class="chat-verlauf" id="chat-verlauf">' + verlauf + '</div>' +
    '<div class="chat-ein">' +
      '<textarea id="iv-text" placeholder="Deine Antwort …"' + TIPP + '></textarea>' +
      micExtra("#iv-text") +
      '<button class="btn btn-primary" data-iv-senden' + (Z.iv.denkt ? " disabled" : "") + '>Senden</button>' +
    '</div></div>' +
    '<div class="nav" style="margin-top:14px"><button class="btn btn-ghost" data-iv-abbruch>&larr; Abbrechen</button>' +
      '<span class="rechts">' + (fertigErlaubt ? '<button class="btn btn-primary" data-iv-fertig' + (Z.iv.denkt ? " disabled" : "") + '>Zusammenfassen und übernehmen</button>' : "") + '</span></div>' +
    '<p class="feldhint">Die Texte dieses Gesprächs gehen an den KI-Anbieter (Anthropic). Keine Patientendaten, Rollen statt Namen.</p>'
  );
}
async function ivSenden(text){
  if(!Z.iv || Z.iv.denkt) return;
  if(text) Z.iv.verlauf.push({r:"ich", t:text});
  Z.iv.denkt = true; save(); render();
  try{
    const res = await api("interview", {token: TOKEN, verlauf: Z.iv.verlauf.map(m => ({rolle:m.r, text:m.t}))});
    if(res.ok && res.antwort) Z.iv.verlauf.push({r:"ki", t:res.antwort});
    else toast(res.grund === "limit" ? "Das KI-Kontingent für heute ist aufgebraucht — morgen geht es weiter, oder nimm das Formular." :
               "Die KI ist gerade nicht erreichbar — du kannst jederzeit aufs Formular wechseln.");
  }catch(e){
    toast("Die KI ist gerade nicht erreichbar — du kannst jederzeit aufs Formular wechseln.");
  }
  if(Z.iv) Z.iv.denkt = false;
  save(); render();
  const v = document.getElementById("chat-verlauf");
  if(v) v.scrollTop = v.scrollHeight;
}
async function ivUebernehmen(){
  if(!Z.iv || Z.iv.denkt) return;
  Z.iv.denkt = true; save(); render();
  let geklappt = false;
  try{
    const res = await api("interview", {token: TOKEN, modus:"auszug", verlauf: Z.iv.verlauf.map(m => ({rolle:m.r, text:m.t}))});
    if(res.ok && res.felder){
      const p = leerPP();
      ["titel","f1","f2","f3","f4","f5","f6"].forEach(k => p[k] = String(res.felder[k] || "").trim());
      p.impuls = "Im Gespräch mit der KI erfasst";
      Z.painpoints.push(p);
      Z.iv = null; geklappt = true; save(); render();
      toast("Übernommen — über «Bearbeiten» kannst du jedes Feld anpassen.");
    } else {
      toast("Zusammenfassen hat nicht geklappt — versuch es gleich nochmals.");
    }
  }catch(e){
    toast("Zusammenfassen hat nicht geklappt — versuch es gleich nochmals.");
  }
  if(Z.iv) Z.iv.denkt = false;
  save(); render();
  /* Der Loop: weiter bis drei Themen — oder die Person sagt, dass keines mehr kommt. */
  if(geklappt && Z.painpoints.length < 3){
    const n = Z.painpoints.length;
    const a = await frage({titel: n === 1 ? "Das erste Thema steht" : "Zwei Themen beisammen",
      ja:"Gleich das nächste erzählen", nein:"Ich habe keine weiteren Themen",
      text:["Ziel sind zwei bis drei Pain Points pro Einheit — jedes Thema zählt am Abend in der Priorisierung mit."]});
    if(a === "ja"){ Z.iv = {verlauf:[], denkt:false}; save(); render(); ivSenden(""); }
  }
}

  return schirm(
    '<span class="snr">' + esc(p.titel || "Neuer Pain Point") + ' · Frage ' + (Erf.nr+1) + ' von ' + schritte.length + '</span>' +
    '<h2>' + esc(s.frage) + ' ' + lautKnopf() + '</h2>' +
    '<div class="efort"><i style="width:' + Math.round(Erf.nr / schritte.length * 100) + '%"></i></div>' +
    '<p class="feldhint" style="margin-top:10px">' + esc(s.hint) + '</p>' +
    (s.beispiel ? '<p class="feldhint" style="font-style:italic">Beispiel (Monatsbericht): «' + esc(s.beispiel) + '»</p>' : '') +
    kontext + feld + nach +
    '<div class="nav">' +
      '<button class="btn btn-ghost" data-erf-zurueck>&larr; ' + (Erf.nr === 0 ? "Übersicht" : "Zurück") + '</button>' +
      '<span class="rechts">' +
        '<button class="btn btn-ghost" data-erf-skip>Überspringen</button>' +
        '<button class="btn btn-primary" data-erf-weiter>' + (Erf.nachfrage ? "So passt es — weiter" : (Erf.nr === schritte.length-1 ? "Abschliessen" : "Weiter")) + '</button>' +
      '</span></div>'
  );
}

function datumFein(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleDateString("de-CH", {day:"numeric", month:"long", year:"numeric"}) + ", " +
           d.toLocaleTimeString("de-CH", {hour:"2-digit", minute:"2-digit"}) + " Uhr";
  }catch(e){ return iso; }
}
function datumTag(iso){
  try{
    return new Date(iso + "T12:00:00").toLocaleDateString("de-CH", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
  }catch(e){ return iso; }
}
function tageBis(iso){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso || "")) return null;
  const heute = new Date(); heute.setHours(12,0,0,0);
  return Math.round((new Date(iso + "T12:00:00") - heute) / 86400000);
}
function countdownHtml(rand){
  const tage = tageBis(P && P.tagung);
  if(tage === null || tage < 0) return "";
  return '<div class="banner"' + (rand ? ' style="margin-top:14px"' : '') + '><span>' +
    (tage === 0
      ? '<b>Heute ist es so weit</b> — die Kadertagung findet heute Abend statt.'
      : 'Noch <b>' + tage + (tage === 1 ? " Tag" : " Tage") + '</b> bis zur Kadertagung am <b>' + esc(datumTag(P.tagung)) + '</b>.') +
    '</span></div>';
}

async function kiSenden(text){
  if(kiDenkt) return;
  if(text) Z.chat.push({r:"ich", t:text});
  kiDenkt = true; save(); render();
  try{
    const res = await api("ki", {token: TOKEN, verlauf: Z.chat.map(m => ({rolle:m.r, text:m.t}))});
    if(res.ok && res.antwort) Z.chat.push({r:"ki", t:res.antwort});
    else toast("Die KI ist gerade nicht erreichbar — später nochmals versuchen.");
  }catch(e){
    toast("Die KI ist gerade nicht erreichbar — später nochmals versuchen.");
  }
  kiDenkt = false; save(); render();
  const v = document.getElementById("chat-verlauf");
  if(v) v.scrollTop = v.scrollHeight;
}

    '<div class="nav" style="justify-content:flex-start"><button class="btn btn-primary" data-pin-senden>Weiter</button></div>' +
    '<p class="feldhint">PIN nicht zur Hand? <a href="mailto:' + HILFE_MAIL + '?subject=PIN%20Kadertagung">Melde dich bei Dölf</a> — du bekommst sie sofort nochmals.</p>'
  );
}
async function pinSenden(){
  const f = document.getElementById("pin-feld");
  const wert = f ? f.value.trim() : "";
  if(!/^\d{4}$/.test(wert)){ pinFehler = "falsch"; render(); return; }
  try{
    const res = await fetch(API + "wer", {method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token:TOKEN, pin:wert})});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const wer = await res.json();
    if(wer.ok){
      PIN = wert;
      try{ localStorage.setItem(PINKEY, wert); }catch(e){}
      bootFehler = ""; pinFehler = "";
      startNachIdentitaet(wer);
    } else if(wer.grund === "pin_limit"){ pinFehler = "limit"; render(); }
    else if(wer.grund === "pin"){ pinFehler = "falsch"; render(); }
    else { bootFehler = "token"; render(); }
  }catch(e){ pinFehler = "netz"; render(); }
}

/* ---------- Rendern ---------- */
function render(){
  const el = document.getElementById("view");
  renderLeiste();
  if(bootFehler === "pin" || bootFehler === "pin_limit"){
    el.innerHTML = vPin(); document.getElementById("leiste").innerHTML = "";
    const pf = document.getElementById("pin-feld"); if(pf) pf.focus();
    return;
  }
  if(bootFehler){ el.innerHTML = vFehler(); document.getElementById("leiste").innerHTML = ""; return; }
  if(!P){ el.innerHTML = vLaden(); return; }
  if(Sch){ el.innerHTML = vSchaerfen(); return; }
  if(Z.iv){
    el.innerHTML = vInterview();
    const v = document.getElementById("chat-verlauf");
    if(v) v.scrollTop = v.scrollHeight;
    return;
  }
  if(Erf){ el.innerHTML = vErfassen(); fokus(); return; }
  const id = HAUPT[Z.schritt];
  if(id === "willkommen") el.innerHTML = vWillkommen();
  else if(id === "warum") el.innerHTML = vWarum();
  else if(id === "hub") el.innerHTML = vHub();
  else if(id === "kontrolle") el.innerHTML = vKontrolle();
  else if(id === "danke") el.innerHTML = vDanke();
  else el.innerHTML = vStandort(Number(id.slice(1)));
  document.getElementById("fuss").innerHTML =
    'Fragen zur Vorbereitung? Melde dich bei der Workshop-Leitung.' + (DEMO ? " · <b>Demo-Modus — es wird nichts gesendet.</b>" : "") +
    (EINGEBETTET && SR ? " · In dieser eingebetteten Vorschau ist das Diktier-Mikrofon ausgeblendet — auf der echten Seite ist es bei jedem Antwortfeld da." : "");
  fokus();
  window.scrollTo({top:0, behavior:"instant"});
}
function fokus(){
  const f = document.querySelector("#view textarea[data-text], #view input[data-text]");
  if(f && window.matchMedia("(min-width:700px)").matches) f.focus();
}

/* ---------- Ereignisse ---------- */
function geh(n){ Z.schritt = clamp(n, 0, HAUPT.length-1); save(); stillsein(); Diktat.stop(); render(); }

document.addEventListener("click", async e => {
  const et = e.target.closest("[data-etappe]");
  if(et && P && !bootFehler){
    if(Sch){ Sch = null; SchReihe = false; }  /* Feinschliff-Vorschlag und Durchgang verwerfen */
    if(Z.iv){
      const a = await frage({titel:"Gespräch verlassen?", ja:"Verlassen", nein:"Beim Gespräch bleiben",
        text:["Der bisherige Verlauf geht dabei verloren — übernommen wird nur über «Zusammenfassen und übernehmen»."]});
      if(a !== "ja") return;
      Z.iv = null; save();
    }
    if(Erf){ erfLesen(); Erf = null; }        /* laufende Erfassung sichern und schliessen */
    geh(Number(et.getAttribute("data-etappe")));
    return;
  }
  const t = e.target.closest("button, label");
  if(!t) return;

  if(t.hasAttribute("data-neuladen")){ location.reload(); return; }
  if(t.hasAttribute("data-mic")){
    e.preventDefault();
    if(Diktat.laeuft()){ Diktat.stop(); return; }
    const feld = t.closest("label.fld").parentElement.querySelector("textarea[data-text], input[data-text]")
              || t.closest("label.fld").querySelector("textarea, input[type=text]");
    mitMic(() => Diktat.start(feld, t));
    return;
  }
  if(t.hasAttribute("data-geh")){ geh(Number(t.getAttribute("data-geh"))); return; }

  /* Haupt-Navigation */
  if(t.hasAttribute("data-zurueck")){ geh(Z.schritt - 1); return; }
  if(t.hasAttribute("data-skip")){ geh(Z.schritt + 1); return; }
  if(t.hasAttribute("data-weiter")){
    const id = HAUPT[Z.schritt];
    if(id === "kontrolle"){ absenden(); return; }
    if(id === "s4"){ toast("Standortbestimmung geschafft — weiter zu den Pain Points."); }
    if(id === "hub" && Z.painpoints.filter(p => (p.titel + p.f1 + p.f2).trim()).length < 2){
      /* Freundliche Schwelle: für die Bewertung am Abend sind 2-3 Themen das Ziel. */
      const n = Z.painpoints.length;
      const a = await frage({titel: n === 0 ? "Noch kein Thema erfasst" : "Erst ein Thema erfasst",
        ja:"Noch ein Thema erfassen", nein: n === 0 ? "Trotzdem weiter" : "Mit einem weitermachen",
        text:["Für die Bewertung am Abend sind zwei bis drei Pain Points pro Einheit ideal — jedes Thema zählt in der Priorisierung mit.",
              "Magst du noch eines dazutun? Der Impuls-Knopf hilft, falls dir gerade keines einfällt."]});
      if(a === "ja"){
        Z.painpoints.push(leerPP()); save();
        Erf = {idx: Z.painpoints.length - 1, nr: 0, nachfrage: "", nachgefragt: false,
               impulsAktiv: false, impulsNr: 0, gewaehlt: ""};
        render(); return;
      }
    }
    geh(Z.schritt + 1); return;
  }

  /* Hub */
  if(t.hasAttribute("data-neu") || t.hasAttribute("data-neu-impuls")){
    Z.painpoints.push(leerPP()); save();
    Erf = {idx: Z.painpoints.length - 1, nr: 0, nachfrage: "", nachgefragt: false,
           impulsAktiv: t.hasAttribute("data-neu-impuls"), impulsNr: 0, gewaehlt: ""};
    render(); return;
  }
  if(t.hasAttribute("data-bearb")){
    Erf = {idx: Number(t.getAttribute("data-bearb")), nr: 0, nachfrage: "", nachgefragt: false,
           impulsAktiv: false, impulsNr: 0, gewaehlt: ""};
    render(); return;
  }
  if(t.hasAttribute("data-loesch")){
    const i = Number(t.getAttribute("data-loesch"));
    const p = Z.painpoints[i];
    const a = await frage({titel:"Thema löschen?", gefahr:true, ja:"Löschen", nein:"Behalten",
      text:["«" + (p.titel || "Ohne Titel") + "» wird aus deinem Entwurf entfernt."]});
    if(a === "ja"){ Z.painpoints.splice(i,1); save(); render(); }
    return;
  }

  /* Geführtes Erfassen */
  if(t.hasAttribute("data-impuls-next")){ Erf.impulsNr++; render(); return; }
  if(t.hasAttribute("data-impuls-nimm")){
    const impulse = impulsliste(P.einheit);
    const gewaehlt = impulse[Erf.impulsNr % impulse.length];
    if(P.interview || DEMO){
      /* Der Impuls ist der Gespraechseinstieg — das leere Thema wieder weg. */
      Z.painpoints.splice(Erf.idx, 1);
      Erf = null;
      Z.iv = {verlauf:[], denkt:false, impuls: gewaehlt}; save(); render();
      ivSenden("Ich steige über diese Frage ein: " + gewaehlt);
      return;
    }
    Erf.gewaehlt = gewaehlt;
    Z.painpoints[Erf.idx].impuls = gewaehlt;
    Erf.impulsAktiv = false; save(); render(); return;
  }
  if(t.hasAttribute("data-erf-abbruch")){
    Z.painpoints.splice(Erf.idx, 1); save();
    Erf = null; render(); return;
  }
  if(t.hasAttribute("data-erf-zurueck")){
    erfLesen();
    if(Erf.nr === 0){ erfFertig(); } else { Erf.nr--; Erf.nachfrage=""; Erf.nachgefragt=false; render(); }
    return;
  }
  if(t.hasAttribute("data-erf-skip")){
    erfLesen();
    erfWeiterOhnePruefung(); return;
  }
  if(t.hasAttribute("data-erf-weiter")){
    erfLesen();
    const s = erfSchritte()[Erf.nr];
    const wert = Z.painpoints[Erf.idx][s.k];
    if(!Erf.nachgefragt){
      const nach = pruefe(s.k, wert);
      if(nach){ Erf.nachfrage = nach; Erf.nachgefragt = true; save(); render(); return; }
    }
    erfWeiterOhnePruefung(); return;
  }

  if(t.hasAttribute("data-pin-senden")){ pinSenden(); return; }
  if(t.hasAttribute("data-fb-senden")){ fbSenden(); return; }

  /* Im Gespräch erfassen */
  if(t.hasAttribute("data-iv-start")){
    Z.iv = {verlauf:[], denkt:false}; save(); render(); ivSenden(""); return;
  }
  if(t.hasAttribute("data-iv-senden")){
    const f = document.getElementById("iv-text");
    const text = f ? f.value.trim() : "";
    if(!text) return;
    Diktat.stop();
    ivSenden(text); return;
  }
  if(t.hasAttribute("data-iv-fertig")){ Diktat.stop(); ivUebernehmen(); return; }
  if(t.hasAttribute("data-iv-abbruch")){
    const a = await frage({titel:"Gespräch abbrechen?", ja:"Abbrechen", nein:"Weitermachen",
      text:["Der bisherige Verlauf geht verloren — übernommen wird nur über «Zusammenfassen und übernehmen»."]});
    if(a === "ja"){ Diktat.stop(); Z.iv = null; save(); render(); }
    return;
  }
  if(t.hasAttribute("data-mic-ziel")){
    e.preventDefault();
    if(Diktat.laeuft()){ Diktat.stop(); return; }
    const feld = document.querySelector(t.getAttribute("data-mic-ziel"));
    if(feld) mitMic(() => Diktat.start(feld, t));
    return;
  }

  /* KI-Feinschliff */
  if(t.hasAttribute("data-schaerf")){ schaerfen(Number(t.getAttribute("data-schaerf"))); return; }
  if(t.hasAttribute("data-schaerf-alle")){
    const i = Z.painpoints.findIndex(p => !p.geglaettet);
    if(i < 0){ toast("Alle Texte sind bereits geglättet."); return; }
    SchReihe = true;                       /* nach dem Entscheid gleich zum naechsten */
    schaerfen(i); return;
  }
  if(t.hasAttribute("data-sch-nimm")){
    const p = Z.painpoints[Sch.idx];
    ["titel","f1","f2","f3","f4","f5","f6"].forEach(k => { if(String(Sch.felder[k] || "").trim()) p[k] = String(Sch.felder[k]).trim(); });
    const offen = Sch.fragen && Sch.fragen.length;
    p.geglaettet = true;
    Sch = null; save();
    if(schaerfWeiter()) return;
    render();
    toast(offen ? "Übernommen — die offenen Nachfragen beantwortest du über «Anpassen»." : "Übernommen.");
    return;
  }
  if(t.hasAttribute("data-sch-weg")){
    if(Sch) Z.painpoints[Sch.idx].geglaettet = true;   /* bewusst so gelassen — nicht nochmals anbieten */
    Sch = null; save();
    if(schaerfWeiter()) return;
    render(); return;
  }

  /* Zusammenfassung zum Mitnehmen */
  if(t.hasAttribute("data-zus-mail")){
    const adr = encodeURIComponent(P.mail || "");
    const betreff = encodeURIComponent("Kadertagung — meine Vorbereitung");
    location.href = "mailto:" + adr + "?subject=" + betreff + "&body=" + encodeURIComponent(zusammenfassungText());
    return;
  }
  if(t.hasAttribute("data-zus-kopie")){
    const text = zusammenfassungText();
    try{
      await navigator.clipboard.writeText(text);
      toast("In die Zwischenablage kopiert.");
    }catch(e){
      const f = document.createElement("textarea");
      f.value = text; f.style.position = "fixed"; f.style.opacity = "0";
      document.body.appendChild(f); f.select();
      try{ document.execCommand("copy"); toast("In die Zwischenablage kopiert."); }
      catch(e2){ toast("Kopieren hat nicht geklappt — markier den Text und kopier ihn von Hand."); }
      f.remove();
    }
    return;
  }
  if(t.hasAttribute("data-zus-druck")){
    const p = document.getElementById("zusdruck");
    if(p) p.textContent = zusammenfassungText();
    window.print();
    return;
  }

  /* KI-Gespräch */
  if(t.hasAttribute("data-ki-start")){ kiSenden(""); return; }
  if(t.hasAttribute("data-ki-senden")){
    const f = document.getElementById("chat-text");
    const text = f ? f.value.trim() : "";
    if(!text) return;
    kiSenden(text); return;
  }

  /* Auswahl-Kacheln optisch nachführen */
  if(t.tagName === "LABEL" && t.closest(".wahl")){
    setTimeout(() => {
      t.closest(".wahl").querySelectorAll("label").forEach(l => {
        const inp = l.querySelector("input");
        l.classList.toggle("an", inp && inp.checked);
      });
    }, 0);
  }
});

function erfLesen(){
  const f = document.querySelector("#view [data-text]");
  if(f && Erf && !Erf.impulsAktiv){
    const p = Z.painpoints[Erf.idx];
    const k = erfSchritte()[Erf.nr].k;
    if(p[k] !== f.value) p.geglaettet = false;   /* von Hand geaendert — Feinschliff neu anbieten */
    p[k] = f.value;
    save();
  }
}
function erfWeiterOhnePruefung(){
  Erf.nachfrage = ""; Erf.nachgefragt = false;
  if(Erf.nr >= erfSchritte().length - 1){ erfFertig(); } else { Erf.nr++; render(); }
}
function erfFertig(){
  const p = Z.painpoints[Erf.idx];
  if(!(p.titel + p.f1 + p.f2 + p.f3 + p.f4 + p.f5 + p.f6).trim()){
    Z.painpoints.splice(Erf.idx, 1);           /* komplett leere Erfassung verwerfen */
  }
  Erf = null; save(); stillsein(); Diktat.stop(); render();
  window.scrollTo({top:0, behavior:"instant"});
}

/* Eingaben laufend übernehmen */
document.addEventListener("input", e => {
  const t = e.target;
  if(t.id === "fb-text"){ Z.fb.text = t.value; save(); return; }
  if(Erf && t.matches("[data-text]")){ erfLesen(); return; }
  const id = HAUPT[Z.schritt];
  if(/^s\d$/.test(id)){
    const f = STANDORT[Number(id.slice(1))];
    if(t.matches('[data-text]')){ Z.standort[f.k] = t.value; save(); return; }
    if(t.matches('[data-anderes]')){ Z.standort.erfahrungAnderes = t.value; save(); return; }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  const id = HAUPT[Z.schritt];
  if(t.name === "menue"){ Z.menue = t.value; save(); return; }
  if(t.name === "fbstufe"){ Z.fb.stufe = Number(t.value); save(); return; }
  if(t.name === "sf"){
    Z.standort[STANDORT[Number(id.slice(1))].k] = t.value; save();
    setTimeout(() => geh(Z.schritt + 1), 350);   /* Radio gewählt → sanft weiter */
    return;
  }
  if(t.type === "checkbox" && /^s\d$/.test(id)){
    const f = STANDORT[Number(id.slice(1))];
    const menge = new Set(Z.standort[f.k]);
    if(t.checked) menge.add(t.value); else menge.delete(t.value);
    Z.standort[f.k] = Array.from(menge); save();
  }
});

/* ---------- Absenden ---------- */
async function absenden(){
  const knopf = document.querySelector("[data-weiter]");
  if(knopf){ knopf.disabled = true; knopf.textContent = "Wird gesendet …"; }
  try{
    const res = await api("abgabe", payload());
    if(!res.ok) throw new Error(res.grund || "abgelehnt");
    Z.gesendet = res.gesendet || new Date().toISOString();
    if(res.zaehler) P.zaehler = res.zaehler;
    save();
    geh(HAUPT.indexOf("danke"));
    return;
  }catch(err){
    const frist = String(err && err.message) === "frist";
    if(knopf){ knopf.disabled = false; knopf.textContent = Z.gesendet ? "Erneut absenden" : "Absenden"; }
    if(frist){
      frage({titel:"Frist abgelaufen", ja:"Verstanden", nein:"",
        text:["Die Rückmeldefrist ist vorbei — dein Beitrag kann online nicht mehr angepasst werden.",
              "Melde dich bei Dölf Rütimann, wenn noch etwas Wichtiges fehlt."]});
      return;
    }
    const a = await frage({titel:"Das Absenden hat nicht geklappt", ja:"Nochmals versuchen",
      drittens:"Als Datei sichern und mailen", nein:"Später",
      text:["Der Server war gerade nicht erreichbar. Dein Entwurf ist sicher auf diesem Gerät gespeichert — es geht nichts verloren."]});
    if(a === "ja"){ absenden(); return; }
    if(a === "drei"){ notfallExport(); }
  }
}
function notfallExport(){
  const name = "painpoints-" + (vorname() || "beitrag").toLowerCase() + ".json";
  const blob = new Blob([JSON.stringify(payload(), null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  location.href = "mailto:" + HILFE_MAIL +
    "?subject=" + encodeURIComponent("Kadertagung — mein Beitrag (" + (P ? P.name : "") + ")") +
    "&body=" + encodeURIComponent("Hallo Dölf\n\nDas Absenden über die Seite hat nicht geklappt. Die Datei " + name + " ist im Anhang (bitte aus dem Download-Ordner anhängen).\n\nLiebe Grüsse\n" + vorname());
  toast("Datei gespeichert — bitte im Mail anhängen.");
}

/* ---------- Start ---------- */
async function startNachIdentitaet(wer){
  P = {name:wer.name, einheit:wer.einheit, rolle:wer.rolle || "teilnahme", frist:wer.frist || "",
       ki:!!wer.ki, interview:!!wer.interview, abgegeben:wer.abgegeben || null, tagung: wer.tagung || "",
       zaehler: wer.zaehler || null};
  await weiterNachStart();
}
(async function(){
  render();                                     /* Ladebildschirm */
  if(DEMO){
    /* Echte Termine, damit Vorschau und Lernvideo nichts Falsches zeigen. */
    P = {name:"Muster Person", einheit:"Controlling / Reporting", rolle:"teilnahme",
         mail:"muster.person@spitaeler-sh.ch",
         frist:"2026-09-07", ki:false, interview:true,
         abgegeben:null, tagung:"2026-09-14",
         zaehler:{einheiten:6, themen:14, total:9}};
  } else if(!TOKEN){
    bootFehler = "token"; render(); return;
  } else {
    try{
      /* Mit gemerkter PIN direkt per POST; sonst erst schauen, ob eine nötig ist. */
      const wer = PIN ? await api("wer", {token: TOKEN}) : await api("wer");
      if(wer.ok && wer.pinNoetig){ bootFehler = "pin"; render(); return; }
      if(!wer.ok){
        if(wer.grund === "pin" || wer.grund === "pin_limit"){
          PIN = ""; try{ localStorage.removeItem(PINKEY); }catch(e){}
          bootFehler = wer.grund === "pin_limit" ? "pin_limit" : "pin"; render(); return;
        }
        bootFehler = "token"; render(); return;
      }
      await startNachIdentitaet(wer);
      return;
    }catch(e){
      bootFehler = "netz"; render(); return;
    }
  }
  await weiterNachStart();
})();
async function weiterNachStart(){
  const entwurf = lade();
  if(entwurf){
    Z = entwurf;
    if(Z.schritt > 0 && Z.schritt < HAUPT.indexOf("danke")) toast("Willkommen zurück — du machst dort weiter, wo du warst.");
  } else if(P.abgegeben && !DEMO){
    /* Zweitgerät: die eigene Abgabe vom Server holen und vorbefüllen */
    try{
      const res = await api("wer", {token: TOKEN, daten: true});
      if(res.ok && res.abgabe){
        Z = leerZ();
        Z.standort = Object.assign(Z.standort, res.abgabe.standort || {});
        Z.painpoints = (res.abgabe.painpoints || []).map(p => Object.assign(leerPP(), p));
        Z.menue = res.abgabe.menue || "";
        Z.gesendet = P.abgegeben;
        Z.schritt = HAUPT.indexOf("kontrolle");
        save();
        toast("Deine frühere Abgabe ist geladen — Änderungen gelten nach erneutem Absenden.");
      }
    }catch(e){ /* dann eben frisch anfangen */ }
  }
  render();
}
</script>
