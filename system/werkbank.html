:root{
  /* Marke */
  --bordeaux:#8A0B38;
  --bordeaux-dunkel:#71092E;
  --gelb:#FFD136;
  --navy:#1A365D;
  --blau:#0B65A1;
  --blau-hell:#2677AB;

  /* Flächen und Schrift */
  --ground:#F3F3F3;
  --surface:#FFFFFF;
  --surface-2:#EAEAEA;
  --ink:#1C1C1C;
  --ink-2:#4E4E4E;
  --ink-3:#7A7A7A;
  --line:#E0E0E0;
  --line-2:#D6D6D6;

  /* Rollen */
  --accent:var(--bordeaux);      /* primäre Aktion, aktiver Zustand */
  --accent-ink:#FFFFFF;
  --accent-soft:#F6E6EC;
  --signal:var(--gelb);          /* Titellinie, Priorität */
  --signal-ink:#6B4E00;
  --signal-soft:#FFF3D0;
  --zahl:var(--blau);            /* Kennzahlen und Links, wie im Web-CD */
  --struktur:var(--navy);        /* Kopfzeilen, Tabellenköpfe */
  --struktur-ink:#FFFFFF;
  --good:#1F6B45;
  --good-soft:#E2F0E8;
  --crit-farbe:#A32218;
  --crit-soft:#F8E4E2;

  --shadow:0 1px 2px rgba(0,0,0,.05), 0 6px 18px -14px rgba(26,54,93,.45);
  --shadow-lift:0 2px 5px rgba(0,0,0,.09), 0 18px 36px -22px rgba(26,54,93,.6);

  --sans:"PT Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:4px;
  --r-s:3px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1726;
    --surface:#152439;
    --surface-2:#1E3049;
    --ink:#E9EDF3;
    --ink-2:#AFBCCC;
    --ink-3:#8494A8;
    --line:#26374F;
    --line-2:#35496483;
    --accent:#E86A93;
    --accent-ink:#2A0512;
    --accent-soft:#39172433;
    --signal:#FFD136;
    --signal-ink:#3A2A00;
    --signal-soft:#3A2E0E;
    --zahl:#63B3E4;
    --struktur:#0A1424;
    --struktur-ink:#E9EDF3;
    --good:#63C795;
    --good-soft:#14301F;
    --crit-farbe:#F0897C;
    --crit-soft:#3A1A16;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 18px -14px rgba(0,0,0,.9);
    --shadow-lift:0 2px 5px rgba(0,0,0,.6), 0 18px 36px -22px rgba(0,0,0,1);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1726;
  --surface:#152439;
  --surface-2:#1E3049;
  --ink:#E9EDF3;
  --ink-2:#AFBCCC;
  --ink-3:#8494A8;
  --line:#26374F;
  --line-2:#354964;
  --accent:#E86A93;
  --accent-ink:#2A0512;
  --accent-soft:#391724;
  --signal:#FFD136;
  --signal-ink:#3A2A00;
  --signal-soft:#3A2E0E;
  --zahl:#63B3E4;
  --struktur:#0A1424;
  --struktur-ink:#E9EDF3;
  --good:#63C795;
  --good-soft:#14301F;
  --crit-farbe:#F0897C;
  --crit-soft:#3A1A16;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 18px -14px rgba(0,0,0,.9);
  --shadow-lift:0 2px 5px rgba(0,0,0,.6), 0 18px 36px -22px rgba(0,0,0,1);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:15.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.22;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--zahl)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- Kopfleiste im Stil der Website ---------- */
.topbar{background:var(--struktur);color:var(--struktur-ink)}
.topbar-in{
  max-width:1180px;margin:0 auto;padding:7px 20px;
  display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;
}
.topbar-in .ort{color:#C9D6E6}



.shell{max-width:1180px;margin:0 auto;padding:0 20px 96px}

.masthead{
  display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;
  padding:26px 0 22px;
}
.brand{display:flex;flex-direction:column;gap:7px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--bordeaux);font-weight:700}
:root[data-theme="dark"] .eyebrow,
:root:not([data-theme="light"]) .eyebrow{color:var(--accent)}
.masthead h1{font-size:clamp(24px,3.6vw,34px)}
.masthead .titleline{width:76px;height:4px;background:var(--signal)}
.masthead .sub{color:var(--ink-2);font-size:14px}
.mast-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.tabs{
  display:flex;gap:0;overflow-x:auto;border-bottom:2px solid var(--line);
  margin-bottom:28px;scrollbar-width:thin;
}
.tab{
  appearance:none;background:none;border:0;border-bottom:3px solid transparent;
  padding:10px 15px;margin-bottom:-2px;cursor:pointer;color:var(--ink-2);
  white-space:nowrap;font-size:14.5px;
}
.tab:hover{color:var(--bordeaux);background:var(--surface-2)}
:root[data-theme="dark"] .tab:hover,
:root:not([data-theme="light"]) .tab:hover{color:var(--accent)}
.tab[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tab .cnt{
  font-size:11.5px;margin-left:7px;padding:1px 6px;border-radius:99px;
  background:var(--surface-2);color:var(--ink-3);font-variant-numeric:tabular-nums;
}
.tab[aria-current="true"] .cnt{background:var(--accent);color:var(--accent-ink)}

/* ---------- Logo ---------- */
.logo-zeile{margin-bottom:4px}
.logo{height:46px;width:auto;display:block}
/* Auf dunklem Grund steht das Logo auf weisser Fläche — Markenfarben bleiben unverändert. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .logo-zeile{
    background:#fff;display:inline-block;padding:9px 13px;border-radius:var(--r);margin-bottom:8px;
  }
}
:root[data-theme="dark"] .logo-zeile{
  background:#fff;display:inline-block;padding:9px 13px;border-radius:var(--r);margin-bottom:8px;
}
@media print{ :root .logo-zeile{background:none;padding:0} }

/* ---------- Teilnehmeransicht ---------- */
.meine{border-top:4px solid var(--signal);gap:18px}
.meine .lead::after{margin-left:0;width:80px}
.meine .a-kopf{align-items:center}
.fortschritt{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.fs{border:1px dashed var(--line-2);border-radius:var(--r-s);padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.fs.teil{border-style:solid;border-color:var(--signal);background:var(--signal-soft)}
.fs.voll{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.fs-n{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.fs-t{font-weight:700;font-size:14.5px}
.fs-s{font-size:12.5px;color:var(--ink-3)}
.fs.voll .fs-s{color:var(--good)}

a.zurueck{
  display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  font-size:13.5px;font-weight:700;color:var(--ink-2);
  border:1px solid var(--line-2);background:var(--surface);
  padding:6px 13px;border-radius:99px;transition:border-color .12s,color .12s;
}
a.zurueck:hover{border-color:var(--accent);color:var(--accent)}
a.zurueck::before{content:"←";font-size:15px;line-height:1}
.zurueck-zeile{padding-top:18px}
@media print{ a.zurueck,.zurueck-zeile{display:none !important} }

/* ---------- Bausteine ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column}
.gap-8{gap:8px} .gap-12{gap:12px} .gap-16{gap:16px} .gap-24{gap:24px} .gap-32{gap:32px}
.row{display:flex;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto;min-width:0}

.btn{
  appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  padding:7px 14px;border-radius:var(--r-s);cursor:pointer;font-size:14px;
  display:inline-flex;align-items:center;gap:7px;transition:background .12s,border-color .12s,color .12s;
}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn-primary{
  background:var(--accent);border-color:var(--accent);color:var(--accent-ink);
  font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:13px;
}
.btn-primary:hover{background:var(--bordeaux-dunkel);border-color:var(--bordeaux-dunkel);color:#fff}
:root[data-theme="dark"] .btn-primary:hover,
:root:not([data-theme="light"]) .btn-primary:hover{background:var(--accent);filter:brightness(1.12);color:var(--accent-ink)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink);border-color:transparent}
.btn-danger:hover{background:var(--crit-soft);border-color:var(--crit-farbe);color:var(--crit-farbe)}
.btn-sm{padding:4px 10px;font-size:13px}
.btn-sm.btn-primary{font-size:12px;padding:5px 11px}

label.fld{display:flex;flex-direction:column;gap:5px}
.fld > .lbl{font-size:13.5px;font-weight:700;color:var(--ink)}
.fld > .hint{font-size:13px;color:var(--ink-3);line-height:1.45}
input[type="text"],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-s);
  padding:8px 10px;font-size:14.5px;
}
input[type="text"]:focus,select:focus,textarea:focus{border-color:var(--accent);outline-offset:0}
textarea{resize:vertical;min-height:76px;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--ink-3)}

.pill{
  display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;
  font-size:12px;letter-spacing:.03em;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);
}
.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:700}
.pill.gold{background:var(--signal);color:var(--signal-ink);border-color:transparent;font-weight:700}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}

/* Gelbe Titellinie — Signaturelement des CD */
.section-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-start;justify-content:space-between}
.section-head h2{font-size:22px;color:var(--ink)}
.section-head h2::after{content:"";display:block;width:56px;height:4px;background:var(--signal);margin-top:9px}
.section-head .note{color:var(--ink-3);font-size:13.5px;max-width:60ch;padding-top:2px}

.empty{
  border:1px solid var(--line-2);border-radius:var(--r);padding:38px 24px;text-align:center;
  color:var(--ink-2);background:var(--surface);
}
.empty h3{font-size:18px;margin-bottom:6px;color:var(--ink)}
.empty h3::after{content:"";display:block;width:56px;height:4px;background:var(--signal);margin:10px auto 0}

.lead{
  font-size:18px;line-height:1.5;color:var(--ink);text-align:center;
  max-width:64ch;margin:0 auto;
}
.lead::after{content:"";display:block;width:120px;height:4px;background:var(--signal);margin:16px auto 0}

/* ---------- Übersicht ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.tile{padding:16px 18px;display:flex;flex-direction:column;gap:2px;text-align:center;align-items:center}
.tile .k{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--zahl);font-weight:700}
.tile .v{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--zahl);line-height:1.15}
.tile .m{font-size:12.5px;color:var(--ink-3)}
.tile.hi .v{color:var(--bordeaux)}
:root[data-theme="dark"] .tile.hi .v,
:root:not([data-theme="light"]) .tile.hi .v{color:var(--accent)}

.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(150px,290px) 1fr 40px;gap:12px;align-items:center;font-size:13.5px}
.bar-row .be{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.bar-row .bn{font-weight:700}
.bar-row .bp{font-size:12px;color:var(--ink-3)}
.bar-row.leer .bn,.bar-row.leer .bp{color:var(--ink-3);font-weight:400}
.bar-row.leer .bar-track{background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 4px,transparent 4px,transparent 8px)}
.bar-track{height:9px;background:var(--surface-2);overflow:hidden;border-radius:2px}
.bar-fill{height:100%;background:var(--zahl)}
.bar-num{font-size:13px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums;font-weight:700}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:14px}
.step{padding:15px 17px;display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--line-2)}
.step.done{border-top-color:var(--good)}
.step.now{border-top-color:var(--signal)}
.step .n{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.step.now .n{color:var(--signal-ink)}
:root[data-theme="dark"] .step.now .n,
:root:not([data-theme="light"]) .step.now .n{color:var(--signal)}
.step.done .n{color:var(--good)}
.step .t{font-weight:700;font-size:15px}
.step .d{font-size:13px;color:var(--ink-2)}

/* ---------- Pain-Point-Karten ---------- */
.pp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(305px,1fr));gap:16px}
.pp{padding:0;overflow:hidden;display:flex;flex-direction:column;border-top:4px solid var(--struktur)}
.pp .pp-top{padding:15px 17px 13px;display:flex;flex-direction:column;gap:9px;flex:1}
.pp .pp-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pp h3{font-size:16.5px}
.pp .pp-txt{font-size:13.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;line-clamp:3;overflow:hidden}
.pp .pp-foot{
  padding:10px 17px;border-top:1px solid var(--line);background:var(--surface-2);
  display:flex;gap:8px;align-items:center;justify-content:space-between;
}
.score{font-size:16px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--zahl);display:inline-flex;align-items:baseline;gap:3px}
.score .u{font-size:11px;color:var(--ink-3);font-weight:400}
.gap-note{font-size:12.5px;color:var(--ink-3)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input[type="text"]{width:auto;min-width:200px;flex:1 1 220px}
.filters select{width:auto}

/* ---------- Editor ---------- */
.editor{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:900px){ .editor{grid-template-columns:minmax(0,1.45fr) minmax(285px,1fr)} }
.panel{padding:19px 21px;display:flex;flex-direction:column;gap:16px}
.panel > h3{font-size:16px;display:flex;align-items:center;gap:10px}
.panel > h3::after{content:none}
.panel > h3 .num{
  font-size:12.5px;width:24px;height:24px;flex:none;font-weight:700;
  display:grid;place-items:center;background:var(--struktur);color:var(--struktur-ink);
}
.two{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:620px){ .two{grid-template-columns:1fr 1fr} }

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  appearance:none;cursor:pointer;padding:5px 12px;border-radius:99px;font-size:13px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}

.dim{margin-top:18px}
.dim:first-of-type{margin-top:4px}
.dim-head{display:flex;gap:10px;align-items:baseline;justify-content:space-between;
  padding-bottom:6px;border-bottom:2px solid var(--accent)}
.dim-name{font-weight:700;font-size:15.5px;letter-spacing:.01em}
.dim-val{font-size:17px;font-weight:700;color:var(--zahl);font-variant-numeric:tabular-nums}
.dim-val .u{font-size:12px;font-weight:400;color:var(--ink-3)}
.dim-q{font-size:13px;color:var(--ink-3);margin:6px 0 2px}
.dim-quelle{background:var(--surface-2);border-radius:8px;padding:9px 11px;margin:8px 0 2px}
.dim-quelle .dq-lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-3);font-weight:700;margin-bottom:4px}
.dim-quelle p{font-size:12.5px;margin:3px 0;color:var(--ink-2);line-height:1.45}
.krit{display:flex;flex-direction:column;gap:5px;padding:12px 0;border-top:1px solid var(--line)}
.dim .krit:first-of-type{border-top:0}
.krit-head{display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.krit-name{font-weight:700;font-size:14px}
.krit-q{font-size:13px;color:var(--ink-3)}
.krit-val{font-size:13px;color:var(--zahl);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
input[type="range"]{width:100%;accent-color:var(--accent);margin:0}

.sticky-bar{
  position:sticky;bottom:0;z-index:5;margin-top:20px;
  background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--signal);
  border-radius:var(--r);padding:11px 15px;display:flex;gap:10px;align-items:center;
  justify-content:space-between;box-shadow:var(--shadow-lift);flex-wrap:wrap;
}

/* ---------- Priorisierung ---------- */
.rank{display:flex;flex-direction:column}
.rank-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 17px;border-top:1px solid var(--line)}
.rank-row:first-child{border-top:0}
.rank-row .pos{font-size:17px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right}
.rank-row.top .pos{color:var(--bordeaux)}
:root[data-theme="dark"] .rank-row.top .pos,
:root:not([data-theme="light"]) .rank-row.top .pos{color:var(--accent)}
.rank-row .ttl{font-weight:700;font-size:15px}
.rank-row .meta{font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.rank-score{display:flex;align-items:center;gap:12px}
.mini-track{width:96px;height:8px;background:var(--surface-2);overflow:hidden;border-radius:2px}
.mini-fill{height:100%;background:var(--zahl)}
.rank-row.top .mini-fill{background:var(--signal)}

.weights{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:15px}
.weight{display:flex;flex-direction:column;gap:3px}
.weight .wl{display:flex;justify-content:space-between;font-size:13px}
.weight .wv{color:var(--zahl);font-variant-numeric:tabular-nums;font-weight:700}

.matrix-wrap{overflow-x:auto}
.matrix{min-width:520px}
.mx-quad{fill:var(--signal-soft)}
.mx-line{stroke:var(--line-2);stroke-width:1}
.mx-label{fill:var(--ink-3);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.mx-axis{fill:var(--struktur);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
:root[data-theme="dark"] .mx-axis,
:root:not([data-theme="light"]) .mx-axis{fill:var(--ink-2)}
.mx-dot{fill:var(--struktur);stroke:var(--surface);stroke-width:2;cursor:pointer}
.mx-dot.top{fill:var(--bordeaux)}
.mx-ring{fill:none;stroke:var(--signal);stroke-width:3}

/* ---- Workshop-Modus: eine Aussage pro Bild, aus fünf Metern lesbar ---- */
.ws{position:fixed;inset:0;z-index:80;background:var(--ground);display:flex;flex-direction:column}
.ws-kopf{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 30px;background:var(--struktur);color:var(--struktur-ink)}
.ws-kopf .ws-phase{font-size:clamp(13px,1.1vw,17px);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.ws-kopf .ws-zaehler{font-size:clamp(13px,1.1vw,17px);color:#C9D6E6;font-variant-numeric:tabular-nums}
.ws-fort{height:5px;background:var(--surface-2)}
.ws-fort > span{display:block;height:100%;background:var(--signal);transition:width .2s}
.ws-buehne{flex:1;overflow:auto;display:flex;flex-direction:column;justify-content:center;
  gap:clamp(14px,2vh,28px);padding:clamp(20px,4vw,64px)}
.ws-einheit{font-size:clamp(15px,1.5vw,22px);font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--bordeaux)}
.ws-titel{font-size:clamp(30px,4.6vw,68px);font-weight:700;line-height:1.1;margin:0}
.ws-echo{font-size:clamp(16px,1.7vw,26px);color:var(--ink-2)}
.ws-karten{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,1.6vw,22px)}
@media (max-width:1100px){ .ws-karten{grid-template-columns:repeat(2,1fr)} }
@media (max-width:640px){ .ws-karten{grid-template-columns:1fr} }
.ws-karte{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:clamp(14px,1.6vw,24px)}
.ws-karte .k{display:block;font-size:clamp(12px,1vw,15px);font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.ws-karte .v{font-size:clamp(17px,1.7vw,27px);line-height:1.35}
.ws-krit{display:flex;align-items:center;gap:clamp(12px,2vw,28px);padding:clamp(8px,1.1vh,16px) clamp(10px,1.4vw,20px);
  border-radius:var(--r-s);border:2px solid transparent}
.ws-krit.an{border-color:var(--signal);background:var(--signal-soft)}
.ws-krit .n{flex:1;font-size:clamp(17px,1.8vw,28px);font-weight:700}
.ws-krit .n small{display:block;font-weight:400;font-size:clamp(13px,1.1vw,18px);color:var(--ink-3)}
.ws-stufen{display:flex;gap:clamp(6px,.7vw,12px)}
.ws-stufe{width:clamp(38px,3.4vw,58px);height:clamp(38px,3.4vw,58px);border-radius:50%;
  border:2px solid var(--line-2);background:var(--surface);color:var(--ink-2);
  font-size:clamp(16px,1.5vw,24px);font-weight:700;cursor:pointer;display:grid;place-items:center}
.ws-stufe.an{background:var(--bordeaux);border-color:var(--bordeaux);color:#FFFFFF}
.ws-wort{min-width:clamp(120px,11vw,200px);font-size:clamp(14px,1.2vw,19px);color:var(--ink-3)}
.ws-dimwert{font-size:clamp(24px,2.6vw,42px);font-weight:700;color:var(--zahl);font-variant-numeric:tabular-nums}
.ws-fuss{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px clamp(20px,3vw,40px);border-top:1px solid var(--line);background:var(--surface)}
.ws-hilfe{font-size:clamp(12px,1vw,15px);color:var(--ink-3)}
.ws-hilfe kbd{font-family:inherit;font-weight:700;background:var(--surface-2);
  border:1px solid var(--line-2);border-radius:4px;padding:1px 6px;margin:0 2px}
.ws-matrix{max-width:min(78vw,900px);margin:0 auto;width:100%}
@media (max-width:700px){ .ws-buehne{justify-content:flex-start} }
:root[data-theme="dark"] .mx-dot,
:root:not([data-theme="light"]) .mx-dot{fill:var(--zahl)}
:root[data-theme="dark"] .mx-dot.top,
:root:not([data-theme="light"]) .mx-dot.top{fill:var(--accent)}
.mx-num{fill:#FFFFFF;font-size:10px;pointer-events:none;font-weight:700}
:root[data-theme="dark"] .mx-num,
:root:not([data-theme="light"]) .mx-num{fill:#0D1726}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.legend b{color:var(--ink-2)}

/* ---------- Tabellen ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{
  font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--struktur-ink);font-weight:700;background:var(--struktur);white-space:nowrap;border-bottom:0;
}
tbody tr:last-child td{border-bottom:0}
td input[type="text"],td select{border-color:transparent;background:transparent;padding:4px 6px}
td input[type="text"]:hover,td select:hover{border-color:var(--line-2)}
td input[type="text"]:focus,td select:focus{border-color:var(--accent);background:var(--surface)}

/* ---------- Use-Case-Steckbrief ---------- */
.uc{padding:0;overflow:hidden;border-top:4px solid var(--struktur)}
.uc-head{padding:16px 19px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.uc-head h3{font-size:18px}
.uc-body{display:grid;grid-template-columns:1fr}
@media (min-width:760px){ .uc-body{grid-template-columns:1fr 1fr} }
.uc-cell{padding:13px 19px;border-bottom:1px solid var(--line)}
.uc-cell .k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--zahl);display:block;margin-bottom:4px;font-weight:700}
.uc-cell .v{font-size:14px;color:var(--ink)}
.uc-cell .v.leer{color:var(--ink-3);font-style:italic}
@media (min-width:760px){ .uc-cell:nth-child(odd){border-right:1px solid var(--line)} }

/* ---------- Export ---------- */
pre.out{
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);
  padding:15px;overflow:auto;max-height:420px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;
  white-space:pre-wrap;word-break:break-word;margin:0;
}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);opacity:0;pointer-events:none;
  background:var(--struktur);color:#fff;padding:10px 18px;border-radius:var(--r);font-size:13.5px;
  z-index:50;transition:opacity .18s,transform .18s;box-shadow:var(--shadow-lift);
  border-left:4px solid var(--signal);
}
:root[data-theme="dark"] #toast,
:root:not([data-theme="light"]) #toast{background:#050C16}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Sprachassistent ---------- */
.fld > .lbl{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.lbl-tools{display:inline-flex;gap:4px;flex:none;opacity:.75;transition:opacity .12s}
label.fld:hover .lbl-tools,.lbl-tools:focus-within{opacity:1}
.iconbtn{
  appearance:none;cursor:pointer;width:23px;height:23px;flex:none;padding:0;
  display:grid;place-items:center;border:1px solid var(--line-2);background:var(--surface);
  color:var(--ink-3);border-radius:99px;transition:background .12s,color .12s,border-color .12s;
}
.iconbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.iconbtn svg{width:12px;height:12px;fill:currentColor;display:block}
.iconbtn.an{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);animation:puls 1.4s ease-in-out infinite}
@keyframes puls{0%,100%{box-shadow:0 0 0 0 rgba(138,11,56,.45)}50%{box-shadow:0 0 0 6px rgba(138,11,56,0)}}

.assistent{border-top:4px solid var(--signal)}
.assistent .a-kopf{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.assistent h3{font-size:16px}
.warn{
  display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.45;
  background:var(--signal-soft);border-left:4px solid var(--signal);
  color:var(--ink-2);padding:9px 12px;border-radius:0 var(--r-s) var(--r-s) 0;
}

.luecken{display:flex;flex-direction:column;gap:7px}

.luecke .lz{
  flex:none;width:19px;height:19px;border-radius:99px;display:grid;place-items:center;
  background:var(--signal);color:var(--signal-ink);font-size:11px;font-weight:700;margin-top:1px;
}
.luecke.ok .lz{background:var(--good-soft);color:var(--good)}

/* ---------- Interview-Overlay ---------- */
.ov{
  position:fixed;inset:0;z-index:60;background:rgba(13,23,38,.72);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.ov-card{
  background:var(--surface);border-radius:var(--r);width:min(720px,100%);max-height:92vh;
  display:flex;flex-direction:column;box-shadow:var(--shadow-lift);overflow:hidden;
}
.ov-top{background:var(--struktur);color:var(--struktur-ink);padding:13px 20px;display:flex;gap:12px;align-items:center;justify-content:space-between}

.ov-body{padding:22px;display:flex;flex-direction:column;gap:14px;overflow:auto}

.ov-frage .ft{flex:1}
.ov-frage .iconbtn{width:34px;height:34px}
.ov-frage .iconbtn svg{width:16px;height:16px}
.ov-hint{font-size:13.5px;color:var(--ink-3)}
.ov-nach{
  font-size:14.5px;background:var(--accent-soft);border-left:4px solid var(--accent);
  padding:11px 14px;color:var(--ink);
}

.ov-body textarea{min-height:120px;font-size:15.5px}
.ov-status{font-size:13px;color:var(--ink-3);min-height:20px;display:flex;align-items:center;gap:8px}
.ov-status .dot{width:9px;height:9px;border-radius:99px;background:var(--accent);animation:puls 1.4s ease-in-out infinite;flex:none}
.ov-foot{
  padding:13px 20px;border-top:1px solid var(--line);background:var(--surface-2);

}

/* ---------- Ablauf ---------- */
.ablauf{display:flex;flex-direction:column}
.ab{display:grid;grid-template-columns:96px 1fr;gap:18px;padding:15px 18px;border-top:1px solid var(--line)}
.ab:first-child{border-top:0}

.ab-e{font-size:11.5px;color:var(--ink-3)}
.ab.eroeffnung .ab-zeit,.ab.abschluss .ab-zeit{border-right-color:var(--struktur)}
.ab.input .ab-zeit{border-right-color:var(--zahl)}

.ab.bewerten .ab-zeit,.ab.verbindlich .ab-zeit{border-right-color:var(--accent)}
.ab.pause{background:var(--surface-2)}

@media (max-width:620px){ .ab{grid-template-columns:1fr;gap:8px} .ab-zeit{flex-direction:row;gap:10px;text-align:left;border-right:0;border-left:3px solid var(--line-2);padding:0 0 0 12px;align-items:baseline} }

/* ---------- Zielerreichung ---------- */
.ziele{display:flex;flex-direction:column;gap:13px}

.profile{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}

  transition:border-color .12s,background .12s;
}

.mail{width:min(760px,100%);max-height:92vh}

a.btn{text-decoration:none}

const KEY = "cas-ki-painpoints-v1";
/* Frühere Fassung kannte sechs Kriterien. Was sich sinnvoll übertragen lässt,
   wird übertragen; die drei neuen Relevanzkriterien starten in der Mitte und
   müssen nachbewertet werden. Der Hinweis dazu erscheint beim ersten Rendern.
   Muss vor dem ersten load()-Aufruf stehen — sonst greift die temporale
   Todeszone und der gespeicherte Stand ginge beim Laden verloren. */
const ALT_NEU = {
  nutzen:      ["zeitverlust","haeufigkeit"],
  machbarkeit: ["technik","organisation"],
  risiko:      ["compliance"],
  aufwand:     ["daten","standard"],
  wertefit:    ["wertefit"],
  pilot:       ["pilot"]
};
const NUR_ALT = Object.keys(ALT_NEU).filter(k => !KRITERIEN.some(c => c.k === k));
let migriert = 0;
function migriereBewertungen(s){
  migriert = 0;
  (s.items||[]).forEach(it=>{
    const b = it.bewertung; if(!b) return;
    /* An den nur alten Schlüsseln erkennen — wertefit und pilot gibt es in
       beiden Rastern und taugen darum nicht zur Unterscheidung. */
    if(!NUR_ALT.some(k => b[k] !== undefined)) return;
    const neu = {};
    KRITERIEN.forEach(c => neu[c.k] = 3);
    Object.keys(ALT_NEU).forEach(alt=>{
      if(b[alt] === undefined) return;
      ALT_NEU[alt].forEach(k => neu[k] = clamp(num(b[alt],3),1,5));
    });
    it.bewertung = neu; migriert++;
  });
  const g = s.gewichte || {};
  if(!KRITERIEN.some(c => g[c.k] !== undefined)) s.gewichte = Object.assign({}, PROFILE[0].w);
}

function leerState(){
  return {

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return leerState();
    const s = Object.assign(leerState(), JSON.parse(raw));
    if(!Array.isArray(s.items)) s.items = [];
    delete s.plan;   /* Aktionsplan aus früheren Versionen — Altbestand räumen */
    if(!Array.isArray(s.teilnehmende) || !s.teilnehmende.length) s.teilnehmende = startTeilnehmende();
    s.teilnehmende.forEach(t => { if(t.link === undefined) t.link = ""; if(t.pin === undefined) t.pin = ""; });
    s.einladung = Object.assign(leerState().einladung, s.einladung || {});
    if(!s.einladung.basis && s.einladung.werkbank) s.einladung.basis = s.einladung.werkbank;
    delete s.einladung.werkbank; delete s.einladung.anleitung;
    migriereBewertungen(s);
    return s;
  }catch(e){ return leerState(); }
}

/* ============================================================
   Berechnung
   ============================================================ */
function bewertet(it){ return !!it.bewertung; }
/* Gewichteter Mittelwert einer Dimension, auf der Skala 1–5. */
function dimWert(it, dim){
  const b = it.bewertung; if(!b) return null;
  let sum=0, gew=0;
  kriterienVon(dim).forEach(c=>{
    const w = num(S.gewichte[c.k], c.w);
    sum += w * clamp(num(b[c.k],3),1,5); gew += w;
  });
  return gew ? sum/gew : null;
}
function score(it){
  if(!it.bewertung) return null;
  let sum=0, max=0;
  KRITERIEN.forEach(c=>{
    const w = num(S.gewichte[c.k], c.w);
    const v = clamp(num(it.bewertung[c.k],3),1,5);
    sum += w*v; max += w*5;
  });
  return max ? Math.round(sum/max*100) : null;
}
function wirkung(it){ /* Y-Achse: wie stark belastet es uns */
  return dimWert(it, "relevanz");
}
function umsetzbarkeit(it){ /* X-Achse: wie leicht kommen wir hin */
  return dimWert(it, "umsetzbarkeit");
}
function rangliste(){
  return S.items.filter(bewertet).sort((a,b)=> score(b)-score(a));
}
function vollstaendig(it){
  return LEITFRAGEN.every(f => (it[f.k]||"").trim().length > 0) && (it.titel||"").trim().length>0;
}
function num(v,d){ const n = Number(v); return Number.isFinite(n) ? n : d; }
function clamp(n,a,b){ return Math.min(b,Math.max(a,n)); }

/* ============================================================
   Rückfragen — eigener Dialog, weil confirm() in eingebetteten
   Seiten von der Sandbox unterdrückt wird
   ============================================================ */
function frage(o){
  return new Promise(fertigMit => {
    const ov = document.createElement("div");
    ov.className = "ov";
    ov.setAttribute("role","dialog");
    ov.setAttribute("aria-modal","true");
    const zeilen = Array.isArray(o.text) ? o.text : [o.text];
    ov.innerHTML =
      '<div class="ov-card dlg">' +
        '<div class="ov-top"><span class="ov-titel">' + esc(o.titel || "Bitte bestätigen") + '</span></div>' +
        '<div class="dlg-body">' + zeilen.map(z => "<p>" + esc(z) + "</p>").join("") + '</div>' +
        '<div class="ov-foot">' +
          '<button class="btn btn-ghost" data-w="nein">' + esc(o.nein || "Abbrechen") + '</button>' +
          '<span class="row gap-8">' +
            (o.drittens ? '<button class="btn" data-w="drei">' + esc(o.drittens) + '</button>' : '') +
            '<button class="btn ' + (o.gefahr ? "btn-danger btn-warnung" : "btn-primary") + '" data-w="ja">' + esc(o.ja || "OK") + '</button>' +
          '</span>' +
        '</div>' +
      '</div>';
    document.body.appendChild(ov);
    const schliessen = wahl => { document.removeEventListener("keydown", taste); ov.remove(); fertigMit(wahl); };
    const taste = e => {
      if(e.key === "Escape"){ e.preventDefault(); schliessen("nein"); }
      if(e.key === "Enter"){ e.preventDefault(); schliessen("ja"); }
    };
    ov.addEventListener("click", e => {
      const b = e.target.closest("[data-w]");
      if(b){ schliessen(b.dataset.w); return; }
      if(e.target === ov) schliessen("nein");
    });
    document.addEventListener("keydown", taste);
    const j = ov.querySelector('[data-w="ja"]'); if(j) j.focus();
  });
}

/* ============================================================
   Hilfen
   ============================================================ */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function nl2br(s){ return esc(s).replace(/\n/g,"<br>"); }
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("on"), 2600);
}
function go(v){ view = v; location.hash = v; render(); window.scrollTo({top:0,behavior:"instant"}); }

/* Cluster kommen aus dem KI-Vorschlag im Dashboard und reisen beim Import mit.
   Ohne Import bleibt das Feld leer und die Gruppierung erscheint gar nicht. */
function clusterImBestand(){
  return [...new Set(S.items.map(i=>(i.cluster||"").trim()).filter(Boolean))].sort();
}

function ppKarte(it){
  const sc = score(it);
  const fehlt = LEITFRAGEN.filter(f=>!(it[f.k]||"").trim()).length;
  return `
  <article class="card pp">
    <div class="pp-top">
      <div class="pp-meta">
        ${it.bereich?`<span class="pill accent">${esc(it.bereich)}</span>`:`<span class="pill">Einheit offen</span>`}
        ${it.person?`<span class="pill">${esc(it.person)}</span>`:""}
        ${(it.cluster||"").trim() && filter.gruppe!=="cluster"?`<span class="pill">${esc(it.cluster)}</span>`:""}
      </div>
      <h3>${esc(it.titel || "Ohne Titel")}</h3>
      <p class="pp-txt">${esc(it.f2 || it.f1 || "Noch keine Beschreibung erfasst.")}</p>
    </div>
    <div class="pp-foot">
      ${sc!==null
        ? `<span class="score">${sc}<span class="u">/100</span></span>`
        : `<span class="gap-note">${fehlt? fehlt+" Leitfrage"+(fehlt>1?"n":"")+" offen" : "noch nicht bewertet"}</span>`}
      <span class="row gap-8">
        <button class="btn btn-sm" data-edit="${it.id}">Bearbeiten</button>
        <button class="btn btn-sm btn-ghost btn-danger" data-del="${it.id}" title="Löschen">Löschen</button>
      </span>
    </div>
  </article>`;
}

function gruppiertHtml(list){
  const gruppen = new Map();
  list.forEach(it=>{
    const k = (it.cluster||"").trim() || "￿Ohne Cluster";
    if(!gruppen.has(k)) gruppen.set(k, []);
    gruppen.get(k).push(it);
  });
  return [...gruppen.keys()].sort().map(k=>{
    const items = gruppen.get(k);
    const einheiten = [...new Set(items.map(i=>i.bereich).filter(Boolean))];
    const titel = k.startsWith("￿") ? "Ohne Cluster" : k;
    return `
    <section class="stack gap-16">
      <div class="section-head">
        <h2>${esc(titel)}</h2>
        <p class="note">${items.length} ${items.length===1?"Thema":"Themen"}${
          einheiten.length>1?` aus ${einheiten.length} Einheiten` : einheiten.length?` aus ${esc(einheiten[0])}`:""}</p>
      </div>
      <div class="pp-grid">${items.map(it=>ppKarte(it)).join("")}</div>
    </section>`;
  }).join("");
}

function matrixSVG(list, hervor){
  const W=640,H=420,P=52;
  const x = v => P + (v-1)/4 * (W-P-24);
  const y = v => (H-P) - (v-1)/4 * (H-P-24);
  const punkte = list.map((it,i)=>{
    const ux = umsetzbarkeit(it), wy = wirkung(it);
    // leichte Streuung, damit deckungsgleiche Bewertungen unterscheidbar bleiben
    const jx = ((i*7)%5 - 2) * 7;
    const jy = ((i*3)%5 - 2) * 7;
    return {cx:x(ux)+jx, cy:y(wy)+jy, i, it, top:i<3};
  });
  return `
  <svg class="matrix" viewBox="0 0 ${W} ${H}" role="img" aria-label="Portfolio: Problemrelevanz gegen Umsetzbarkeit">
    <rect x="${x(3)}" y="24" width="${W-24-x(3)}" height="${y(3)-24}" class="mx-quad" rx="6"></rect>
    <line x1="${P}" y1="${y(3)}" x2="${W-24}" y2="${y(3)}" class="mx-line"></line>
    <line x1="${x(3)}" y1="24" x2="${x(3)}" y2="${H-P}" class="mx-line"></line>
    <line x1="${P}" y1="${H-P}" x2="${W-24}" y2="${H-P}" class="mx-line"></line>
    <line x1="${P}" y1="24" x2="${P}" y2="${H-P}" class="mx-line"></line>

    <text x="${W-30}" y="40" text-anchor="end" class="mx-label">Jetzt pilotieren</text>
    <text x="${P+10}" y="40" class="mx-label">Voraussetzung schaffen</text>
    <text x="${P+10}" y="${H-P-10}" class="mx-label">Parken</text>
    <text x="${W-30}" y="${H-P-10}" text-anchor="end" class="mx-label">Quick Win</text>

    <text x="${P}" y="${H-18}" class="mx-axis">Umsetzbarkeit →</text>
    <text x="0" y="0" class="mx-axis" transform="translate(16,${H-P}) rotate(-90)">Problemrelevanz →</text>

    ${punkte.map(p=>`
      <g data-edit="${p.it.id}" style="cursor:pointer">
        <title>${esc(p.it.titel||"Ohne Titel")} — Score ${score(p.it)}</title>
        ${hervor===p.it.id?`<circle cx="${p.cx.toFixed(1)}" cy="${p.cy.toFixed(1)}" r="22" class="mx-ring"></circle>`:""}
        <circle cx="${p.cx.toFixed(1)}" cy="${p.cy.toFixed(1)}" r="13" class="mx-dot ${p.top?"top":""}"></circle>
        <text x="${p.cx.toFixed(1)}" y="${(p.cy+3.2).toFixed(1)}" text-anchor="middle" class="mx-num">${p.i+1}</text>
      </g>`).join("")}
  </svg>`;
}

function themenVon(einheit){ return einheit ? S.items.filter(i => i.bereich === einheit).length : 0; }
function tageBis(datum){
  if(!datum) return null;
  const z = new Date(datum + "T23:59:59");
  if(isNaN(z)) return null;
  return Math.ceil((z - new Date()) / 86400000);
}
function fristText(){
  const t = tageBis(S.einladung.frist);
  if(t === null) return "";
  if(t < 0)  return "überfällig seit " + Math.abs(t) + (Math.abs(t)===1?" Tag":" Tagen");
  if(t === 0) return "heute fällig";
  return "noch " + t + (t===1?" Tag":" Tage");
}
const STAENDE = ["offen","eingeladen","erinnert","eingegangen","abgesagt"];
const MENUES = ["offen","Cordon bleu","Wienerschnitzel","Zürcher Geschnetzeltes","Vegetarisch","Vegan","kein Essen"];
function menueZaehlung(){
  const z = {};
  S.teilnehmende.filter(t => t.da).forEach(t => { const m = t.menue || "offen"; z[m] = (z[m]||0)+1; });
  return MENUES.filter(m => z[m]).map(m => z[m] + " × " + m).join(" · ") || "noch nichts erfasst";
}
/* Sobald Themen aus einer Einheit vorliegen, gilt sie als eingegangen —
   von Hand lässt sich der Stand jederzeit überschreiben. */
function standVon(t){
  if(t.stand && t.stand !== "offen" && t.stand !== "eingeladen") return t.stand;
  if(t.einheit && themenVon(t.einheit) > 0) return "eingegangen";
  if(t.stand) return t.stand;
  return t.eingeladen ? "eingeladen" : "offen";
}
function offeneTeilnehmende(){
  return S.teilnehmende.filter(t => t.da && t.einheit && t.mail && !["eingegangen","abgesagt"].includes(standVon(t)));
}

          '<button class="btn" data-mail="datei">Als Datei</button>' +

        '</span>' +
      '</div>' +
    '</div>';
  document.body.appendChild(ov);
  const felder = () => [document.getElementById("mail-betreff").value, document.getElementById("mail-text").value];
  const linkFrisch = () => {
    const [bt, tx] = felder();
    document.getElementById("mail-link").href = mailtoLink(ziel.map(t=>t.mail), bt, tx);
  };
  linkFrisch();
  ov.addEventListener("input", linkFrisch);
  ov.addEventListener("click", e => {
    const b = e.target.closest("[data-mail]");
    if(e.target === ov || (b && b.dataset.mail === "zu")){ ov.remove(); return; }
    if(!b) return;
    const [bt, tx] = felder();
    if(b.dataset.mail === "kopieren"){
      const ganz = "An (BCC): " + ziel.map(t=>t.mail).join(", ") + "\nBetreff: " + bt + "\n\n" + tx;
      if(navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(ganz).then(()=>toast("Einladung kopiert"), ()=>toast("Text im Feld markieren und kopieren"));
      else toast("Text im Feld markieren und kopieren");
    }
    if(b.dataset.mail === "datei"){
      download("einladung-kadertagung-" + heute() + ".txt",
        "An (BCC): " + ziel.map(t=>t.mail).join(", ") + "\nBetreff: " + bt + "\n\n" + tx, "text/plain");
    }
  });
  document.getElementById("mail-link").addEventListener("click", () => {
    ziel.forEach(t => { const r = S.teilnehmende.find(x=>x.id===t.id); if(r) r.eingeladen = true; });
    save();
    setTimeout(() => { ov.remove(); render(); }, 400);
  });
}

function heute(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function alsMarkdown(){
  const L = [];
  L.push("# Kadertagung Finanzbereich — KI Pain Points und Use Cases");
  L.push("");
  L.push("Stand: " + heute() + " · " + S.items.length + " Pain Points, " + S.items.filter(bewertet).length + " bewertet");
  L.push("");
  const rl = rangliste();
  if(rl.length){
    L.push("## Priorisierung");
    L.push("");
    L.push("| Rang | Thema | Bereich | Score |");
    L.push("|---|---|---|---|");
    rl.forEach((it,i)=> L.push(`| ${i+1} | ${it.titel||"Ohne Titel"} | ${it.bereich||"—"} | ${score(it)} |`));
    L.push("");
  }
  L.push("## Pain Points");
  L.push("");
  const order = rl.length ? rl.concat(S.items.filter(i=>!bewertet(i))) : S.items;
  order.forEach((it,i)=>{
    L.push(`### ${i+1}. ${it.titel||"Ohne Titel"}`);
    L.push("");
    L.push(`**Bereich:** ${it.bereich||"—"} · **Eingebracht von:** ${it.person||"—"}` + (bewertet(it)?` · **Score:** ${score(it)}/100`:""));
    if(it.merkmale.length) L.push(`**Merkmale:** ${it.merkmale.join(", ")}`);
    L.push("");
    LEITFRAGEN.forEach((f,k)=>{
      L.push(`**${k+1}. ${f.t}**`);
      L.push("");
      L.push((it[f.k]||"").trim() || "_offen_");
      L.push("");
    });
    if(it.uc_name || it.uc_nutzen || it.uc_risiken || it.uc_test || it.werte.length){
      L.push("**Use-Case-Steckbrief**");
      L.push("");
      L.push("| Punkt | Beschreibung |");
      L.push("|---|---|");
      L.push(`| Name | ${einzeilig(it.uc_name)} |`);
      L.push(`| Nutzen | ${einzeilig(it.uc_nutzen)} |`);
      L.push(`| Risiken | ${einzeilig(it.uc_risiken)} |`);
      L.push(`| Werte-Fit | ${it.werte.join(", ")||"—"} |`);
      L.push(`| Erster Test | ${einzeilig(it.uc_test)} |`);
      L.push("");
    }
    if(bewertet(it)){
      DIMENSIONEN.forEach(d=>{
        const w = dimWert(it, d.k);
        L.push(`**${d.n}** ${w!==null?w.toFixed(1):"—"}/5 — ` +
          kriterienVon(d.k).map(c=>`${c.n} ${clamp(num(it.bewertung[c.k],3),1,5)}`).join(" · "));
      });
      L.push("");
    }
    if((it.notiz||"").trim()){ L.push("**Notizen:** " + einzeilig(it.notiz)); L.push(""); }
  });
  L.push("## Teilnehmende");
  L.push("");
  L.push("| Name | Funktion | Organisationseinheit | Rolle | Menü | Themen | Rückmeldung |");
  L.push("|---|---|---|---|---|---|---|");
  S.teilnehmende.forEach(t => {
    const n = t.einheit ? S.items.filter(i=>i.bereich===t.einheit).length : null;
    L.push(`| ${t.name||"—"} | ${t.funktion||"—"} | ${t.einheit||"—"} | ${t.rolle||"—"} | ${t.menue||"offen"} | ${n===null?"—":n} | ${standVon(t)}${t.eingang?" ("+t.eingang+")":""}${t.notiz?" — "+t.notiz:""} |`);
  });
  L.push("\nMenüwahl: " + menueZaehlung());
  if(S.einladung.frist) L.push("\nRückmeldefrist: " + S.einladung.frist + " (" + fristText() + ")");
  L.push("");
  L.push("## Wirkungsmessung");
  L.push("");
  L.push("| Use Case | Messgrösse | Heute | Ziel | Wer misst | Wann |");
  L.push("|---|---|---|---|---|---|");
  (rangliste().length ? rangliste() : S.items).slice(0,5).forEach(it =>
    L.push(`| ${it.uc_name||it.titel||"Ohne Titel"} | ${it.m_groesse||"offen"} | ${it.m_heute||"offen"} | ${it.m_ziel||"offen"} | ${it.m_wer||"offen"} | ${it.m_termin||"offen"} |`));
  L.push("");
  L.push("## Zielerreichung des Workshops");
  L.push("");
  L.push("| Ziel | Stand |");
  L.push("|---|---|");
  wirkungsziele().forEach(z => L.push(`| ${z.t} | ${z.ist} von ${z.soll}${z.hinweis?" — "+z.hinweis:""} |`));
  return L.join("\n");
}
function einzeilig(s){ return String(s||"").replace(/\s*\n\s*/g," ").replace(/\|/g,"\\|").trim() || "—"; }

function alsCSV(){
  const head = ["Titel","Bereich","Eingebracht von"]
    .concat(KRITERIEN.map(c=>c.n))
    .concat(["Problemrelevanz","Umsetzbarkeit","Score","Werte"]);
  const rows = S.items.map(it=>{
    const b = it.bewertung||{};
    const dz = d => { const w = dimWert(it, d); return w!==null ? w.toFixed(1).replace(".",",") : ""; };
    return [it.titel, it.bereich, it.person]
      .concat(KRITERIEN.map(c=> bewertet(it) ? clamp(num(b[c.k],3),1,5) : ""))
      .concat([ dz("relevanz"), dz("umsetzbarkeit"), bewertet(it)?score(it):"", it.werte.join(" / ") ]);
  });
  return [head].concat(rows).map(r => r.map(z => `"${String(z==null?"":z).replace(/"/g,'""')}"`).join(";")).join("\r\n");
}

/* Speichern. Eingebettete Seiten dürfen nicht direkt herunterladen —
   dort übernimmt die Speicherfunktion der Umgebung, sonst der klassische Weg. */
function klassischSpeichern(name, text, mime){
  try{
    const blob = new Blob([text], {type:(mime||"text/plain")+";charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    return true;
  }catch(e){ return false; }
}
function download(name, text, mime){
  const dl = window.claude && window.claude.downloads;
  if(dl && typeof dl.save === "function"){
    dl.save({filename:name, data:text})
      .then(() => toast("«" + name + "» gespeichert"))
      .catch(err => {
        const code = err && err.code;
        if(code === "declined" || code === "rate_limited") return;
        if(/\.csv$/.test(name) && (code === "extension_not_enabled" || code === "rejected_extension")){
          dl.save({filename:name.replace(/\.csv$/, ".txt"), data:text})
            .then(() => toast("Als Textdatei gespeichert — in Excel über «Daten aus Text» mit Semikolon öffnen"))
            .catch(() => { if(!klassischSpeichern(name, text, mime)) toast("Speichern nicht möglich — Protokoll unten markieren und kopieren."); });
          return;
        }
        if(!klassischSpeichern(name, text, mime)) toast("Speichern nicht möglich — Protokoll unten markieren und kopieren.");
      });
    return;
  }
  if(!klassischSpeichern(name, text, mime)) toast("Speichern nicht möglich — Protokoll unten markieren und kopieren.");
}

document.addEventListener("change", e => {

  if(t.dataset && t.dataset.stimme !== undefined){ S.stimme = t.value; save(); vorlesen("Stimme geändert."); return; }
  if(t.dataset && t.dataset.einl){ S.einladung[t.dataset.einl] = t.value; save(); return; }
  if(t.dataset && t.dataset.vorlesenAus !== undefined){
    S.vorlesenAus = t.checked; save();
    if(t.checked) stillsein();
    toast(t.checked ? "Vorlesen ausgeschaltet" : "Vorlesen eingeschaltet");
    return;
  }
  if(t.hasAttribute && t.hasAttribute("data-einheit")){   /* leeres Attribut ist falsch-wertig — hasAttribute nötig */
    const cur = S.items.find(i=>i.id===editId);
    if(cur){
      cur.bereich = t.value;
      const per = verantwortlich(t.value);
      if(per && !(cur.person||"").trim()){
        cur.person = per;
        const feld = document.querySelector('[data-f="person"]');
        if(feld) feld.value = per;
      }
      save(); renderTabs(); lueckenFrisch();
    }
    return;
  }
  if(t.id==="f-bereich"){ filter.bereich = t.value; render(); return; }
  if(t.id==="f-nur"){ filter.nur = t.value; render(); return; }
  if(t.id==="f-gruppe"){ filter.gruppe = t.value; render(); return; }
  if(t.dataset && t.dataset.tn){
    const r = S.teilnehmende.find(x=>x.id===t.dataset.tn);
    if(r){
      r[t.dataset.k] = (t.type==="checkbox") ? t.checked : t.value;
      save(); renderTabs();
      /* Auswahlfelder verändern die Kennzahlen oben — neu zeichnen. */
      if(["menue","stand","rolle","einheit","da"].includes(t.dataset.k)){
        const sy = window.scrollY; render(); window.scrollTo(0, sy);
      }
    }
    return;
  }
  if(t.id==="file-in" && t.files && t.files[0]){
    const f = t.files[0];
    const r = new FileReader();
    r.onload = () => {
      try{
        const daten = JSON.parse(r.result);
        if(!daten || !Array.isArray(daten.items)) throw new Error("Kein gültiger Export");
        const sauber = daten.items.map(i => {
          const n = Object.assign(neuerItem(), i);
          if(!Array.isArray(n.merkmale)) n.merkmale = [];
          if(!Array.isArray(n.werte)) n.werte = [];
          n.id = uid();
          return n;
        });
        const ersetzen = () => {
          S = Object.assign(leerState(), daten, {items:sauber});
          save(); render(); toast(S.items.length + " Pain Points eingelesen");
        };
        if(!S.items.length){ ersetzen(); return; }
        frage({titel:"Beiträge zusammenführen", ja:"Dazunehmen", drittens:"Ersetzen", nein:"Abbrechen",
          text:[sauber.length + " Pain Points in der Datei, " + S.items.length + " bereits erfasst.",
                "«Dazunehmen» behält die bestehenden und ergänzt die neuen — bereits vorhandene Themen werden übersprungen. «Ersetzen» verwirft alles Bestehende."]})
          .then(a => {
            if(a === "drei"){ ersetzen(); return; }
            if(a !== "ja") return;
            /* Doppelte anhand von Einheit und Titel überspringen */
            const bekannt = new Set(S.items.map(i => (i.bereich+"|"+i.titel).toLowerCase().trim()));
            const neue = sauber.filter(i => !bekannt.has((i.bereich+"|"+i.titel).toLowerCase().trim()));
            S.items = S.items.concat(neue);
            save(); render();
            toast(neue.length + " dazugenommen" + (sauber.length-neue.length ? ", " + (sauber.length-neue.length) + " bereits vorhanden" : ""));
          });
      }catch(err){ toast("Datei konnte nicht gelesen werden — bitte JSON aus dem Export verwenden."); }
      finally{ t.value = ""; }
    };
    r.readAsText(f);
  }
});

/* ============================================================
   Sprachassistent
   Diktat und Vorlesen über die Sprachdienste des Browsers.
   Die Nachfragen sind regelbasiert — kein Sprachmodell im Hintergrund.
   ============================================================ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
/* Eingebettet ist der Mikrofonzugriff durch die Umgebung gesperrt —
   dann blenden wir das Diktat ganz aus, statt einen toten Knopf zu zeigen. */
const KANN_DIKTAT = !!SR && !(function(){ try{ return window.self !== window.top; }catch(e){ return true; } })();
const KANN_VORLESEN = typeof window.speechSynthesis !== "undefined";
const SPRACHE = "de-CH";
const MIC_KEY = KEY + "-mikrofon";
/* In einer eingebetteten Seite verweigert die Umgebung den Mikrofonzugriff.
   Das lässt sich von innen nicht aufheben — wir sagen es deshalb klar. */
const EINGEBETTET = (function(){ try{ return window.self !== window.top; }catch(e){ return true; } })();
let micGesperrt = false;

function stimmen(){
  if(!KANN_VORLESEN) return [];
  const alle = window.speechSynthesis.getVoices() || [];
  const de = alle.filter(v => /^de/i.test(v.lang));
  /* Die Google-Stimmen klingen deutlich natürlicher als die des Systems
     und stehen deshalb oben in der Liste. */
  const punkte = v => (/google/i.test(v.name) ? 0 : /microsoft|natural|neural/i.test(v.name) ? 1 : 2);
  return (de.length ? de : alle).slice().sort((a,b) => punkte(a) - punkte(b));
}
function gewaehlteStimme(){
  const liste = stimmen();
  if(!liste.length) return null;
  const gemerkt = liste.find(v => v.name === S.stimme);
  if(gemerkt) return gemerkt;
  return liste.find(v => /google/i.test(v.name) && /^de/i.test(v.lang))
      || liste.find(v => /^de/i.test(v.lang))
      || liste[0];
}

function micFreigabe(){
  try{ return localStorage.getItem(MIC_KEY) === "ok"; }catch(e){ return false; }
}
/* Führt fn aus, sobald die Spracheingabe freigegeben ist. */
function mitMic(fn){
  if(!KANN_DIKTAT){ toast("Dieser Browser kennt keine Spracheingabe — Diktat gibt es in Chrome und Edge."); return; }
  if(micFreigabe()){ fn(); return; }
  frage({titel:"Spracheingabe aktivieren", ja:"Aktivieren", nein:"Nicht jetzt",
    text:["Die Erkennung läuft über den Sprachdienst des Browsers. Chrome und Edge übermitteln die Aufnahme dazu an den Hersteller.",
          "Bitte keine Patientendaten und keine Personendaten diktieren — beschreibt Rollen statt Namen.",
          "Die Freigabe gilt für diesen Browser und lässt sich jederzeit widerrufen."]})
    .then(a => {
      if(a !== "ja") return;
      try{ localStorage.setItem(MIC_KEY, "ok"); }catch(e){}
      fn();
    });
}

function sprachbefehle(t){
  return t
    .replace(/\bneuer? absatz\b/gi, "\n\n").replace(/\bneue zeile\b/gi, "\n")
    .replace(/\bdoppelpunkt\b/gi, ":").replace(/\bfragezeichen\b/gi, "?")
    .replace(/\bausrufezeichen\b/gi, "!").replace(/\bkomma\b/gi, ",").replace(/\bpunkt\b/gi, ".")
    .replace(/\s+([,.;:?!])/g, "$1").replace(/[ \t]{2,}/g, " ").trim();
}
function anfuegen(alt, neu){
  if(!neu) return alt;
  if(!String(alt).trim()) return neu.charAt(0).toUpperCase() + neu.slice(1);
  if(/\n$/.test(alt)) return alt + neu;
  return alt.replace(/[ \t]+$/, "") + " " + neu;
}

const Diktat = {
  r:null, btn:null, feld:null, basis:"", timer:null, melder:null,
  laeuft(){ return !!this.r; },
  start(feld, btn, melder){
    if(!KANN_DIKTAT || !micFreigabe()) return false;   /* Freigabe kommt über mitMic() */
    this.stop();
    const r = new SR();
    r.lang = SPRACHE; r.continuous = true; r.interimResults = true;
    this.r = r; this.feld = feld; this.btn = btn; this.melder = melder || null;
    this.basis = feld ? feld.value : "";
    if(btn) btn.classList.add("an");
    if(this.melder) this.melder("Ich höre zu — sprich einfach los.", true);
    r.onresult = e => {
      let fertig = "", zwischen = "";
      for(let i = e.resultIndex; i < e.results.length; i++){
        const t = e.results[i][0].transcript;
        if(e.results[i].isFinal) fertig += t + " "; else zwischen += t;
      }
      if(fertig) this.basis = anfuegen(this.basis, sprachbefehle(fertig));
      if(this.feld){
        this.feld.value = zwischen.trim() ? anfuegen(this.basis, zwischen.trim()) : this.basis;
        if(fertig) this.feld.dispatchEvent(new Event("input", {bubbles:true}));
      }
      clearTimeout(this.timer);
      this.timer = setTimeout(() => {
        if(this.melder) this.melder("Pause erkannt — weitersprechen oder «Weiter».", true);
      }, 3500);
    };
    r.onerror = ev => {
      if(ev.error === "not-allowed" || ev.error === "service-not-allowed"){
        micGesperrt = true;
        this.stop();
        frage({titel:"Mikrofon gesperrt", ja:"Verstanden", nein:"",
          text: EINGEBETTET
            ? ["Diese Seite läuft in einem eingebetteten Fenster. Dort sperrt die Umgebung den Mikrofonzugriff — das lässt sich von innen nicht ändern.",
               "Für Diktat und Interview öffnet die Werkbank als eigene Seite: die Datei index.html direkt im Browser, oder die Adresse, unter der sie bereitgestellt wird.",
               "Tippen funktioniert hier ganz normal weiter."]
            : ["Der Browser hat den Zugriff auf das Mikrofon verweigert.",
               "Erlaubt ihn im Schloss-Symbol links in der Adresszeile und versucht es nochmals."]});
        render();
        return;
      }
      toast(ev.error === "no-speech" ? "Nichts gehört — bitte nochmals."
          : ev.error === "audio-capture" ? "Kein Mikrofon gefunden."
          : "Spracherkennung nicht verfügbar (" + ev.error + ").");
      this.stop();
    };
    r.onend = () => { if(this.r === r) this.stop(); };
    try{ r.start(); }catch(err){ this.stop(); return false; }
    return true;
  },
  stop(){
    clearTimeout(this.timer);
    if(this.r){ const r = this.r; this.r = null; try{ r.stop(); }catch(e){} }
    if(this.feld){
      this.feld.value = this.basis;
      this.feld.dispatchEvent(new Event("input", {bubbles:true}));
      this.feld = null;
    }
    if(this.btn){ this.btn.classList.remove("an"); this.btn = null; }
    if(this.melder){ this.melder("", false); this.melder = null; }
  }
};

function vorlesen(text, danach){
  if(!KANN_VORLESEN || !text || (S && S.vorlesenAus)){ if(danach) danach(); return; }
  try{ window.speechSynthesis.cancel(); }catch(e){}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = SPRACHE; u.rate = clamp(num(S.tempo, 1), 0.7, 1.4);
  const v = gewaehlteStimme();
  if(v){ try{ u.voice = v; u.lang = v.lang; }catch(e){} }
  let fertig = false;
  const ende = () => { if(fertig) return; fertig = true; if(danach) danach(); };
  u.onend = ende; u.onerror = ende;
  window.speechSynthesis.speak(u);
}

const PRUEFUNG = {

  f1: [{ok:t=>t.trim().split(/\s+/).length>=10, text:"Frage 1: Ablauf konkreter beschreiben",
        frage:"Beschreib den Ablauf bitte etwas genauer: Was passiert von Anfang bis Ende?"}],

  f3: [{ok:t=>RX.rollen.test(t), text:"Frage 3: Beteiligte benennen",
        frage:"Welche Teams, Schnittstellen oder externen Stellen sind ausserdem beteiligt?"}],
  f4: [{ok:t=>RX.daten.test(t), text:"Frage 4: Systeme und Dokumente nennen",

function pruefe(feld, wert){
  const t = String(wert||"");
  if(!t.trim()) return {leer:true, text:(feld==="titel"?"Titel":"Frage "+feld.slice(1))+" noch offen",
                        frage:(PRUEFUNG[feld]&&PRUEFUNG[feld][0]?PRUEFUNG[feld][0].frage:"")};
  const regel = (PRUEFUNG[feld]||[]).find(r => !r.ok(t));
  return regel ? {leer:false, text:regel.text, frage:regel.frage} : null;
}
function lueckenHtml(it){
  const l = luecken(it);
  return l.length
    ? `<div class="luecken">${l.map(x=>`<span class="luecke"><span class="lz">!</span><span>${esc(x)}</span></span>`).join("")}</div>`
    : `<div class="luecken"><span class="luecke ok"><span class="lz">✓</span><span>Alles beisammen — Leitfragen, Werte-Bezug und Bewertung sind erfasst.</span></span></div>`;
}
function lueckenFrisch(){
  const el = document.getElementById("luecken-panel");
  const it = S.items.find(i => i.id === editId);
  if(el && it) el.innerHTML = lueckenHtml(it);
}
function luecken(it){
  const l = [];
  const t = pruefe("titel", it.titel); if(t) l.push(t.text);
  if(!it.bereich) l.push("Organisationseinheit noch nicht gewählt");
  LEITFRAGEN.forEach(f => { const p = pruefe(f.k, it[f.k]); if(p) l.push(p.text); });
  if(!it.werte.length) l.push("Werte-Bezug noch offen");
  if(!bewertet(it)) l.push("Noch nicht bewertet");
  if((it.uc_test||"").trim() && !(it.m_groesse||"").trim()) l.push("Messgrösse für die Wirkung fehlt");
  return l;
}

const Interview = {
  schritte:[], nr:0, nachgefragt:false, ov:null, id:null, impulse:[], impulsNr:0, gewaehlt:"",
  start(id, mitImpuls){
    const it = S.items.find(i=>i.id===id); if(!it) return;
    this.id = id; this.nr = 0; this.nachgefragt = false; this.gewaehlt = "";
    this.impulse = impulsliste(it.bereich); this.impulsNr = 0;
    const basis = [{k:"titel", frage:"Wie würdest du den Pain Point in einem Satz benennen?",
                    hint:"Ein kurzer, verständlicher Titel genügt."}]
      .concat(LEITFRAGEN.map((f,i) => ({k:f.k, frage:(i+1)+". "+f.t, hint:f.h})));
    this.schritte = mitImpuls ? [{typ:"impuls"}].concat(basis) : basis;
    this.bauen();
    this.zeigen(true);
  },
  naechsterImpuls(){
    this.impulsNr = (this.impulsNr + 1) % this.impulse.length;
    this.zeigenImpuls(true);
  },
  zeigenImpuls(sprechen){
    const q = x => this.ov.querySelector(x);
    const text = this.impulse[this.impulsNr] || "";
    q("#ov-schritt").textContent = "Einstieg";
    q("#ov-bar").style.width = "0%";
    q("#ov-frage").textContent = text;
    q("#ov-hint").textContent = "Kein Thema im Kopf? Diese Fragen helfen beim Suchen. Passt eine, machen wir daraus einen Pain Point.";
    q("#ov-nach").innerHTML = "";
    q("#ov-text").style.display = "none";
    q("#ov-weiter").textContent = "Das kenne ich";
    q("#ov-skip").textContent = "Anderer Impuls";
    this.melder("Impuls " + (this.impulsNr+1) + " von " + this.impulse.length, false);
    if(sprechen) vorlesen(text);
  },
  bauen(){
    const ov = document.createElement("div");
    ov.className = "ov"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true");
    ov.innerHTML =
      '<div class="ov-card">' +
        '<div class="ov-top"><span class="ov-titel">Geführtes Interview</span><span class="ov-schritt" id="ov-schritt"></span></div>' +
        '<div class="ov-progress"><span id="ov-bar" style="width:0%"></span></div>' +
        '<div class="ov-body">' +
          '<div class="ov-frage"><span class="ft" id="ov-frage"></span>' +
            (KANN_VORLESEN ? '<button type="button" class="iconbtn" id="ov-lies" title="Frage nochmals vorlesen">' + ICON_LAUT + '</button>' : '') +
          '</div>' +
          '<p class="ov-hint" id="ov-hint"></p>' +
          '<div id="ov-nach"></div>' +
          '<textarea id="ov-text" rows="4" placeholder="Antwort — diktiert oder getippt"></textarea>' +
          '<div class="ov-status" id="ov-status"></div>' +
          (KANN_DIKTAT ? '' : '<p class="ov-hint">Antworten bitte tippen — die Spracheingabe ist in diesem Fenster gesperrt. Sie funktioniert, wenn die Werkbank als eigene Seite geöffnet wird.</p>') +
        '</div>' +
        '<div class="ov-foot">' +
          '<span class="row gap-8">' +
            (KANN_DIKTAT ? '<button class="btn" id="ov-mic">Mikrofon</button>' : '') +
            '<button class="btn btn-ghost" id="ov-skip">Überspringen</button>' +
          '</span>' +
          '<span class="row gap-8">' +
            '<button class="btn btn-ghost" id="ov-ende">Beenden</button>' +
            '<button class="btn btn-primary" id="ov-weiter">Weiter</button>' +
          '</span>' +
        '</div>' +
      '</div>';
    document.body.appendChild(ov);
    this.ov = ov;

    const q = s => ov.querySelector(s);
    q("#ov-weiter").addEventListener("click", () => this.weiter());
    q("#ov-skip").addEventListener("click", () => {
      const s = this.aktuell();
      if(s && s.typ === "impuls"){ this.naechsterImpuls(); return; }
      Diktat.stop(); this.nachgefragt = false; this.nr++; this.zeigen(true);
    });
    q("#ov-ende").addEventListener("click", () => this.schliessen());
    if(q("#ov-lies")) q("#ov-lies").addEventListener("click", () => vorlesen(this.aktuell().frage));
    if(q("#ov-mic")) q("#ov-mic").addEventListener("click", () => this.mic());
    ov.addEventListener("click", e => { if(e.target === ov) this.schliessen(); });
    this.esc = e => { if(e.key === "Escape") this.schliessen(); };
    document.addEventListener("keydown", this.esc);
  },
  aktuell(){ return this.schritte[this.nr] || null; },
  it(){ return S.items.find(i => i.id === this.id); },
  melder(text, an){
    const st = this.ov && this.ov.querySelector("#ov-status");
    if(!st) return;
    st.innerHTML = text ? (an ? '<span class="dot"></span>' : "") + esc(text) : "";
  },
  mic(){
    const feld = this.ov.querySelector("#ov-text");
    const btn = this.ov.querySelector("#ov-mic");
    if(Diktat.laeuft()){ Diktat.stop(); btn.textContent = "Mikrofon"; return; }
    stillsein();
    mitMic(() => { if(Diktat.start(feld, null, (t,a) => this.melder(t,a))) btn.textContent = "Mikrofon aus"; });
  },
  zeigen(sprechen){
    Diktat.stop();
    const s = this.aktuell();
    if(!s){ this.fertig(); return; }
    const it = this.it(); if(!it){ this.schliessen(); return; }
    const q = x => this.ov.querySelector(x);
    if(s.typ === "impuls"){ this.zeigenImpuls(sprechen); return; }
    q("#ov-text").style.display = "";
    q("#ov-weiter").textContent = "Weiter";
    q("#ov-skip").textContent = "Überspringen";
    const vor = (this.schritte[0] && this.schritte[0].typ === "impuls") ? 1 : 0;
    q("#ov-schritt").textContent = "Frage " + (this.nr+1-vor) + " von " + (this.schritte.length-vor);
    q("#ov-bar").style.width = Math.round((this.nr-vor) / (this.schritte.length-vor) * 100) + "%";
    q("#ov-frage").textContent = s.frage;
    q("#ov-hint").textContent = s.hint || "";
    q("#ov-nach").innerHTML = "";
    q("#ov-text").value = it[s.k] || "";
    const mb = q("#ov-mic"); if(mb) mb.textContent = "Mikrofon";
    this.melder("", false);
    if(sprechen && KANN_VORLESEN){
      vorlesen(s.frage + (s.hint ? " " + s.hint : ""), () => {
        if(this.ov && this.aktuell() === s && KANN_DIKTAT && micFreigabe()){
          if(Diktat.start(q("#ov-text"), null, (t,a) => this.melder(t,a))){
            const b = q("#ov-mic"); if(b) b.textContent = "Mikrofon aus";
          }
        }
      });
    }
  },
  weiter(){
    const s = this.aktuell(); if(!s) return;
    if(s.typ === "impuls"){
      this.gewaehlt = this.impulse[this.impulsNr] || "";
      const it0 = this.it();
      if(it0 && !(it0.notiz||"").trim()) { it0.notiz = "Einstieg über den Impuls: " + this.gewaehlt; save(); }
      this.nr++;
      const naechste = this.aktuell();
      if(naechste) naechste.hint = "Du hast gesagt, das kennst du: «" + this.gewaehlt + "» — genau darum geht es jetzt.";
      this.zeigen(true);
      return;
    }
    Diktat.stop();
    const it = this.it(); if(!it) return this.schliessen();
    const wert = this.ov.querySelector("#ov-text").value;
    it[s.k] = wert;
    if(s.k === "titel") renderTabs();
    save();
    const p = pruefe(s.k, wert);
    if(p && p.frage && !this.nachgefragt){
      this.nachgefragt = true;
      const nach = this.ov.querySelector("#ov-nach");
      nach.innerHTML = '<div class="ov-nach"><b>Nachfrage</b>' + esc(p.frage) + '</div>';
      this.melder("", false);
      vorlesen(p.frage, () => {
        if(this.ov && KANN_DIKTAT && micFreigabe()){
          if(Diktat.start(this.ov.querySelector("#ov-text"), null, (t,a) => this.melder(t,a))){
            const b = this.ov.querySelector("#ov-mic"); if(b) b.textContent = "Mikrofon aus";
          }
        }
      });
      return;
    }
    this.nachgefragt = false;
    this.nr++;
    this.zeigen(true);
  },
  fertig(){
    const it = this.it();
    this.schliessen();
    if(!it) return;
    const l = luecken(it);
    const satz = l.length
      ? "Danke. Offen sind noch " + l.length + " Punkte — sie stehen im Formular unter «Was noch fehlt»."
      : "Danke, der Pain Point ist vollständig beschrieben.";
    toast(satz);
    vorlesen(satz);
    render();
  },
  schliessen(){
    Diktat.stop(); stillsein();
    if(this.esc) document.removeEventListener("keydown", this.esc);
    if(this.ov){ this.ov.remove(); this.ov = null; }
    render();
  }
};

(function(){
  let box = null, weg = null;
  function zeige(el){
    const begriff = el.dataset.gl;
    const text = GLOSSAR[begriff];
    if(!text) return;
    verstecke();
    box = document.createElement("div");
    box.className = "gl-box";
    box.innerHTML = '<b>' + esc(begriff) + '</b>' + esc(text);
    document.body.appendChild(box);
    const r = el.getBoundingClientRect();
    const bb = box.getBoundingClientRect();
    let links = r.left + r.width/2 - bb.width/2;
    links = Math.max(12, Math.min(links, window.innerWidth - bb.width - 12));
    let oben = r.top - bb.height - 10;
    if(oben < 12){ oben = r.bottom + 10; box.classList.add("unten"); }
    box.style.left = links + "px";
    box.style.top = (oben + window.scrollY) + "px";
    requestAnimationFrame(() => box && box.classList.add("an"));
  }
  function verstecke(){ if(box){ box.remove(); box = null; } }
  document.addEventListener("mouseover", e => {
    const el = e.target.closest("[data-gl]");
    if(!el) return;
    clearTimeout(weg); weg = setTimeout(() => zeige(el), 180);
  });
  document.addEventListener("mouseout", e => {
    if(!e.target.closest("[data-gl]")) return;
    clearTimeout(weg); verstecke();
  });
  document.addEventListener("focusin", e => { const el = e.target.closest("[data-gl]"); if(el) zeige(el); });
  document.addEventListener("focusout", verstecke);
  document.addEventListener("keydown", e => { if(e.key === "Escape") verstecke(); });
  window.addEventListener("scroll", verstecke, {passive:true});
})();

/* ============================================================
   Workshop-Modus — die Ansicht für den Beamer
   Ein Gedanke pro Bild, aus fünf Metern lesbar, mit der Tastatur
   bedienbar. Namen erscheinen hier nie: am Tisch wird über Themen
   gesprochen, nicht über Personen.
   ============================================================ */
const Workshop = {
  offen:false, i:0, kritIdx:0, bilder:[],

  /* Reihenfolge: bewertete Themen zuerst nach Score, danach die offenen.
     So steht am Anfang, was die Runde schon eingeordnet hat. */
  liste(){
    return rangliste().concat(S.items.filter(i=>!bewertet(i)));
  },

  bauen(){
    const b = [];
    this.liste().forEach(it=>{
      b.push({typ:"thema", id:it.id});
      b.push({typ:"verstehen", id:it.id});
      DIMENSIONEN.forEach(d => b.push({typ:"bewerten", id:it.id, dim:d.k}));
      b.push({typ:"position", id:it.id});
    });
    if(b.length) b.push({typ:"ergebnis"});
    return b;
  },

  start(){
    if(!S.items.length){ toast("Noch keine Pain Points gesammelt"); return; }
    this.bilder = this.bauen();
    this.i = 0; this.kritIdx = 0; this.offen = true;
    const el = document.createElement("div");
    el.className = "ws"; el.id = "ws";
    document.body.appendChild(el);
    document.body.style.overflow = "hidden";
    const w = document.documentElement;
    if(w.requestFullscreen) w.requestFullscreen().catch(()=>{});
    document.addEventListener("keydown", this.taste);
    this.zeigen();
  },

  schliessen(){
    if(!this.offen) return;
    this.offen = false;
    document.removeEventListener("keydown", this.taste);
    const el = document.getElementById("ws"); if(el) el.remove();
    document.body.style.overflow = "";
    if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
    render();
  },

  weiter(n){
    const neu = this.i + n;
    if(neu < 0 || neu >= this.bilder.length) return;
    this.i = neu; this.kritIdx = 0; this.zeigen();
  },

  /* Wert setzen und zum nächsten Kriterium rücken. Ist die Dimension
     fertig, bleibt der Fokus auf dem letzten — weitergeblättert wird
     bewusst von Hand, damit die Runde nachjustieren kann. */
  werten(stufe){
    const bild = this.bilder[this.i];
    if(!bild || bild.typ !== "bewerten") return;
    const it = S.items.find(x=>x.id===bild.id); if(!it) return;
    if(!it.bewertung) it.bewertung = KRITERIEN.reduce((a,c)=>(a[c.k]=3,a),{});
    const ks = kriterienVon(bild.dim);
    it.bewertung[ks[this.kritIdx].k] = clamp(stufe,1,5);
    if(this.kritIdx < ks.length-1) this.kritIdx++;
    save(); this.zeigen();
  },

  taste(e){
    const W = Workshop;
    if(!W.offen) return;
    if(e.key === "Escape"){ e.preventDefault(); W.schliessen(); return; }
    if(e.key === "ArrowRight" || e.key === "PageDown" || e.key === " "){ e.preventDefault(); W.weiter(1); return; }
    if(e.key === "ArrowLeft"  || e.key === "PageUp"){ e.preventDefault(); W.weiter(-1); return; }
    const bild = W.bilder[W.i];
    if(bild && bild.typ === "bewerten"){
      if(e.key === "ArrowDown"){ e.preventDefault();
        W.kritIdx = Math.min(kriterienVon(bild.dim).length-1, W.kritIdx+1); W.zeigen(); return; }
      if(e.key === "ArrowUp"){ e.preventDefault();
        W.kritIdx = Math.max(0, W.kritIdx-1); W.zeigen(); return; }
      if(/^[1-5]$/.test(e.key)){ e.preventDefault(); W.werten(Number(e.key)); return; }
    }
  },

  /* Wie viele andere Themen teilen den Cluster — das Signal, ob ein
     Thema ein Einzelfall ist oder ein gemeinsames Muster. */
  echo(it){
    const c = (it.cluster||"").trim();
    if(!c) return "";
    const gleiche = S.items.filter(x => (x.cluster||"").trim() === c);
    if(gleiche.length < 2) return "";
    const einheiten = [...new Set(gleiche.map(x=>x.bereich).filter(Boolean))];
    return gleiche.length + " Themen aus " + einheiten.length +
      (einheiten.length === 1 ? " Einheit" : " Einheiten") + " gehören zu «" + c + "»";
  },

  zeigen(){
    const el = document.getElementById("ws"); if(!el) return;
    const bild = this.bilder[this.i];
    const it = bild.id ? S.items.find(x=>x.id===bild.id) : null;
    const fortschritt = Math.round((this.i+1) / this.bilder.length * 100);

    const PHASEN = {thema:"Thema", verstehen:"Verstehen", bewerten:"Bewerten",
                    position:"Positionieren", ergebnis:"Ergebnis"};

    let buehne = "";
    if(bild.typ === "thema"){
      const e = this.echo(it);
      buehne = `
        <div class="ws-einheit">${esc(it.bereich || "Einheit offen")}</div>
        <h1 class="ws-titel">${esc(it.titel || "Ohne Titel")}</h1>
        ${e?`<p class="ws-echo">${esc(e)}</p>`:""}`;
    }

    if(bild.typ === "verstehen"){
      const felder = [
        ["Worum es geht", it.f1], ["Was heute nicht optimal läuft", it.f2],
        ["Wer betroffen ist", it.f3], ["Daten und Systeme", it.f4],
        ["Zielbild", it.f5], ["Erste Vermutung", it.f6]
      ].filter(f => (f[1]||"").trim());
      buehne = `
        <div class="ws-einheit">${esc(it.bereich || "Einheit offen")}</div>
        <h1 class="ws-titel" style="font-size:clamp(24px,3vw,44px)">${esc(it.titel || "Ohne Titel")}</h1>
        ${felder.length ? `<div class="ws-karten">${felder.map(f=>`
          <div class="ws-karte"><span class="k">${esc(f[0])}</span><span class="v">${esc(f[1])}</span></div>`).join("")}
        </div>` : `<p class="ws-echo">Zu diesem Thema sind noch keine Leitfragen beantwortet.</p>`}`;
    }

    if(bild.typ === "bewerten"){
      const d = DIMENSIONEN.find(x=>x.k===bild.dim);
      const ks = kriterienVon(bild.dim);
      const b = it.bewertung || {};
      const w = dimWert(it, bild.dim);
      buehne = `
        <div class="row gap-16" style="justify-content:space-between;align-items:baseline">
          <div>
            <div class="ws-einheit">${esc(it.titel || "Ohne Titel")}</div>
            <h1 class="ws-titel" style="font-size:clamp(26px,3.2vw,48px)">${esc(d.n)}</h1>
          </div>
          <span class="ws-dimwert">${w!==null?w.toFixed(1):"—"}<span class="u" style="font-size:.5em;color:var(--ink-3)">/5</span></span>
        </div>
        <div>${ks.map((c,ix)=>{
          const v = bewertet(it) ? clamp(num(b[c.k],3),1,5) : 0;
          return `
          <div class="ws-krit ${ix===this.kritIdx?"an":""}" data-ws-krit="${ix}">
            <span class="n">${esc(c.n)}<small>${esc(c.q)}</small></span>
            <span class="ws-stufen">${[1,2,3,4,5].map(s=>`
              <button type="button" class="ws-stufe ${v===s?"an":""}" data-ws-set="${ix}:${s}">${s}</button>`).join("")}
            </span>
            <span class="ws-wort">${v?esc(c.s[v-1]):"noch offen"}</span>
          </div>`;
        }).join("")}</div>`;
    }

    if(bild.typ === "position"){
      const liste = rangliste();
      buehne = `
        <div class="ws-einheit">${esc(it.titel || "Ohne Titel")}</div>
        <h1 class="ws-titel" style="font-size:clamp(24px,3vw,44px)">Wo steht das Thema?</h1>
        ${bewertet(it) ? `<div class="ws-matrix">${matrixSVG(liste, it.id)}</div>`
          : `<p class="ws-echo">Noch nicht bewertet — die beiden vorigen Bilder ausfüllen.</p>`}`;
    }

    if(bild.typ === "ergebnis"){
      const liste = rangliste();
      buehne = `
        <h1 class="ws-titel" style="font-size:clamp(26px,3.4vw,52px)">Unser Portfolio</h1>
        ${liste.length ? `<div class="ws-matrix">${matrixSVG(liste)}</div>
        <div class="ws-karten">${liste.slice(0,6).map((x,ix)=>`
          <div class="ws-karte"><span class="k">${ix+1} · ${esc(x.bereich||"Einheit offen")}</span>
          <span class="v">${esc(x.titel||"Ohne Titel")}</span></div>`).join("")}</div>`
          : `<p class="ws-echo">Noch nichts bewertet.</p>`}`;
    }

    const hilfe = bild.typ === "bewerten"
      ? `<kbd>1</kbd>–<kbd>5</kbd> bewerten · <kbd>↑</kbd><kbd>↓</kbd> Kriterium · <kbd>←</kbd><kbd>→</kbd> Bild · <kbd>Esc</kbd> beenden`
      : `<kbd>←</kbd><kbd>→</kbd> Bild wechseln · <kbd>Esc</kbd> beenden`;

    el.innerHTML = `
      <div class="ws-kopf">
        <span class="ws-phase">${esc(PHASEN[bild.typ])}</span>
        <span class="ws-zaehler">${this.i+1} von ${this.bilder.length}</span>
      </div>
      <div class="ws-fort"><span style="width:${fortschritt}%"></span></div>
      <div class="ws-buehne">${buehne}</div>
      <div class="ws-fuss">
        <span class="ws-hilfe">${hilfe}</span>
        <span class="row gap-8">
          <button class="btn" data-ws-nav="-1" ${this.i===0?"disabled":""}>Zurück</button>
          <button class="btn btn-primary" data-ws-nav="1" ${this.i===this.bilder.length-1?"disabled":""}>Weiter</button>
          <button class="btn btn-ghost" data-ws-ende>Beenden</button>
        </span>
      </div>`;

    el.onclick = e => {
      const nav = e.target.closest("[data-ws-nav]");
      if(nav){ this.weiter(Number(nav.dataset.wsNav)); return; }
      if(e.target.closest("[data-ws-ende]")){ this.schliessen(); return; }
      const set = e.target.closest("[data-ws-set]");
      if(set){ const [ix,s] = set.dataset.wsSet.split(":").map(Number);
        this.kritIdx = ix; this.werten(s); return; }
      const kr = e.target.closest("[data-ws-krit]");
      if(kr){ this.kritIdx = Number(kr.dataset.wsKrit); this.zeigen(); }
    };
  }
};

/* Start */
if(S.theme) document.documentElement.setAttribute("data-theme", S.theme);
render();
if(migriert){
  save();
  setTimeout(()=>toast(migriert + " Bewertung" + (migriert>1?"en":"") +
    " auf das neue Raster übertragen — bitte prüfen"), 600);
}
})();
</script>
